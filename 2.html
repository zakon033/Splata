<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { width: 800px; height: 600px; } /* Визуальный размер */
    </style>
</head>
<body>

<canvas id="lensCanvas"></canvas>

<script>
const canvas = document.getElementById('lensCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

// Поддержка высокого разрешения (Retina)
const dpr = window.devicePixelRatio || 2;
const width = 800;
const height = 600;
canvas.width = width * dpr;
canvas.height = height * dpr;
ctx.scale(dpr, dpr);

const bgCanvas = document.createElement('canvas');
bgCanvas.width = canvas.width;
bgCanvas.height = canvas.height;
const bgCtx = bgCanvas.getContext('2d');
bgCtx.scale(dpr, dpr);

// Буфер кадра
const tempCanvas = document.createElement('canvas');
tempCanvas.width = canvas.width;
tempCanvas.height = canvas.height;
const tCtx = tempCanvas.getContext('2d');

function drawStaticBackground() {
    const grad = bgCtx.createLinearGradient(0, 0, width, height);
    grad.addColorStop(0, '#1a0033');
    grad.addColorStop(0.5, '#c1272d');
    grad.addColorStop(1, '#4a148c');
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, width, height);
    
    bgCtx.fillStyle = 'white';
    bgCtx.font = '900 120px sans-serif';
    bgCtx.textAlign = 'center';
    bgCtx.textBaseline = 'middle';
    bgCtx.globalAlpha = 0.5;
    bgCtx.fillText('IPHONE 16', width/2, height/2);
}

const lenses = [
    { x: 200, y: 200, r: 140, sx: 1.2, sy: 0.9 },
    { x: 600, y: 400, r: 120, sx: -1.0, sy: -1.3 },
    { x: 400, y: 300, r: 160, sx: 0.6, sy: -0.8 }
];

// ГЛАВНОЕ: Функция для плавного (билинейного) забора пикселей
function applySmoothRefraction(lens, sourceCtx) {
    const x = lens.x;
    const y = lens.y;
    const r = lens.r;
    
    // Получаем данные пикселей из буфера
    const sourceData = sourceCtx.getImageData(0, 0, canvas.width, canvas.height);
    const targetData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const src = sourceData.data;
    const dst = targetData.data;

    const startX = Math.max(0, Math.floor((x - r) * dpr));
    const endX = Math.min(canvas.width, Math.ceil((x + r) * dpr));
    const startY = Math.max(0, Math.floor((y - r) * dpr));
    const endY = Math.min(canvas.height, Math.ceil((y + r) * dpr));

    for (let py = startY; py < endY; py++) {
        for (let px = startX; px < endX; px++) {
            const dx = px / dpr - x;
            const dy = py / dpr - y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < r) {
                const refraction = Math.pow(dist / r, 0.6);
                const sx = (x + dx * refraction) * dpr;
                const sy = (y + dy * refraction) * dpr;

                // Билинейная интерполяция
                const x0 = Math.floor(sx);
                const x1 = Math.min(x0 + 1, canvas.width - 1);
                const y0 = Math.floor(sy);
                const y1 = Math.min(y0 + 1, canvas.height - 1);
                const dx_w = sx - x0;
                const dy_w = sy - y0;

                const idx = (py * canvas.width + px) * 4;
                
                for (let c = 0; c < 4; c++) {
                    const p00 = src[(y0 * canvas.width + x0) * 4 + c];
                    const p10 = src[(y0 * canvas.width + x1) * 4 + c];
                    const p01 = src[(y1 * canvas.width + x0) * 4 + c];
                    const p11 = src[(y1 * canvas.width + x1) * 4 + c];

                    const val = p00 * (1 - dx_w) * (1 - dy_w) +
                                p10 * dx_w * (1 - dy_w) +
                                p01 * (1 - dx_w) * dy_w +
                                p11 * dx_w * dy_w;
                    dst[idx + c] = val;
                }
            }
        }
    }
    ctx.putImageData(targetData, 0, 0);
}

function drawLensVfx(lens) {
    const x = lens.x;
    const y = lens.y;
    const r = lens.r;

    // Голубое свечение
    const blueGrad = ctx.createRadialGradient(x, y, 0, x, y, r);
    blueGrad.addColorStop(0.6, 'rgba(0, 120, 255, 0)');
    blueGrad.addColorStop(0.95, 'rgba(0, 180, 255, 0.4)');
    blueGrad.addColorStop(1, 'rgba(0, 180, 255, 0)');
    ctx.fillStyle = blueGrad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // Белая кайма (очень тонкая)
    const whiteEdge = ctx.createRadialGradient(x, y, r - 1.5, x, y, r + 0.5);
    whiteEdge.addColorStop(0, 'rgba(255, 255, 255, 0)');
    whiteEdge.addColorStop(0.5, 'rgba(255, 255, 255, 0.8)');
    whiteEdge.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = whiteEdge;
    ctx.beginPath();
    ctx.arc(x, y, r + 0.5, 0, Math.PI * 2);
    ctx.fill();
}

function render() {
    ctx.drawImage(bgCanvas, 0, 0, width * dpr, height * dpr, 0, 0, width, height);

    lenses.forEach(lens => {
        lens.x += lens.sx;
        lens.y += lens.sy;
        if (lens.x < 100 || lens.x > width - 100) lens.sx *= -1;
        if (lens.y < 100 || lens.y > height - 100) lens.sy *= -1;

        tCtx.clearRect(0, 0, canvas.width, canvas.height);
        tCtx.drawImage(canvas, 0, 0);

        applySmoothRefraction(lens, tCtx);
        drawLensVfx(lens);
    });

    requestAnimationFrame(render);
}

drawStaticBackground();
render();
</script>

</body>
</html>
