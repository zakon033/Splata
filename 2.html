<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">

<title>Переказ коштів</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  min-height: 100vh;
  min-height: -webkit-fill-available; /* дополнительный фикс для полного заполнения на iOS */
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  color: #ffffff;
  overflow-x: hidden;
}

/* Фиксованный фон — теперь покрывает ВСЁ, включая safe areas */
.fixed-bg {
  position: fixed;
  inset: 0; /* top:0; left:0; right:0; bottom:0; */
  background-color: #1b1f3b; /* fallback */
  background-image: url("./bg-liquid.webp");
  background-repeat: no-repeat;
  background-position: center;
  background-size: cover;
  z-index: -1;
}

/* Контейнер с отступами под safe areas (чтобы контент не залезал под notch/home bar) */
.container {
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
  padding: max(24px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom)) 16px;
  position: relative;
  z-index: 1;
}

/* Остальные стили без изменений */
h1 {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 600;
}

.small {
  font-size: 14px;
  opacity: 0.75;
  margin-bottom: 18px;
}

.section {
  display: grid;
  gap: 12px;
  margin-bottom: 22px;
}

.btn,
.copy {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 18px;
  border-radius: 48px;
  background-color: rgba(255,255,255,0.18);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  backdrop-filter: blur(18px) saturate(170%);
  color: #ffffff;
  font-size: 16px;
  font-weight: 500;
  text-decoration: none;
  border: none;
  outline: none;
  box-shadow: 0 10px 28px rgba(0,0,0,0.25), inset 0 1px 1px rgba(255,255,255,0.35);
  transition: transform .15s ease, box-shadow .15s ease;
}

@supports (-webkit-mask-image: url("")) {
  .btn,
  .copy {
    -webkit-mask-image: url("./mask/glass-edge.webp");
    -webkit-mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
  }
}

.btn::after,
.copy::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: radial-gradient(at 30% 20%, rgba(255,255,255,0.45), transparent 60%);
  mix-blend-mode: overlay;
  opacity: 0.6;
}

.btn:active,
.copy:active {
  transform: scale(0.97);
  box-shadow: 0 6px 16px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.25);
}

.copy {
  cursor: pointer;
}
</style>
</head>

<body>
  <div class="fixed-bg"></div>

    <div class="small">Оберіть зручний спосіб</div>

    <div class="section">

      <div class="copy" onclick="copyText('4441114459954077')">

      <a class="btn" href="https://app.binance.com/uni-qr/LXViL5Hb">Binance Pay</a>

      <div class="copy" onclick="copyText('bc1qktmy8wcu3uvyugx3fgttg4t00akuvdk24anxcp')">

      <div class="copy" onclick="copyText('0xCcbD44EA963812ECc7F592a608245284c5cD87D9')">

      <a class="btn"

</html>
