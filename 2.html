<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#1b1f3b">

<style>
/* =========================
   1. БАЗОВІ НАЛАШТУВАННЯ ТА ВИПРАВЛЕННЯ СМУГ
========================= */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; 
}

html {
  background-color: #1b1f3b; 
}

body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #ffffff;
  background: transparent !important; 
  position: relative;
}

/* =========================
   2. ФОНОВЕ ЗОБРАЖЕННЯ (Зі стабілізацією прокрутки)
========================= */
#background-image-wrap {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1; 
  
  background-image: url("./bg-liquid.webp");
  background-size: cover;
  background-position: center center;
  background-attachment: fixed; 
  
  transform: translateZ(0); 
  -webkit-transform: translateZ(0);

  /* НОВЕ: ГРАДІЄНТНА МАСКА */
  mask-image: linear-gradient(
    to bottom, 
    transparent 0%, 
    rgba(0, 0, 0, 0) calc(env(safe-area-inset-top) + 10px), 
    black calc(env(safe-area-inset-top) + 60px), 
    black calc(100% - 60px - env(safe-area-inset-bottom)), 
    rgba(0, 0, 0, 0) calc(100% - 10px - env(safe-area-inset-bottom)), 
    transparent 100% 
  );
  -webkit-mask-image: linear-gradient(
    to bottom, 
    transparent 0%, 
    rgba(0, 0, 0, 0) calc(env(safe-area-inset-top) + 10px), 
    black calc(env(safe-area-inset-top) + 60px), 
    black calc(100% - 60px - env(safe-area-inset-bottom)), 
    rgba(0, 0, 0, 0) calc(100% - 10px - env(safe-area-inset-bottom)), 
    transparent 100% 
  );
}

/* =========================
   3. КОНТЕЙНЕР (ПРОКРУЧУВАНИЙ КОНТЕНТ)
========================= */
.container {
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
  
  background-color: transparent; 
  position: relative;
  z-index: 10; 
  
  transform: translateZ(0); 
  -webkit-transform: translateZ(0);

  padding: 
    calc(60px + env(safe-area-inset-top)) 
    20px 
    calc(60px + env(safe-area-inset-bottom)); 
    
  text-align: center;
}

h1 {
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 8px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.subtitle {
  font-size: 15px;
  opacity: 0.9;
  margin-bottom: 30px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* =========================
   4. КНОПКИ (BLUR)
========================= */
.btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 12px;
  padding: 18px 20px;
  
  backdrop-filter: blur(15px); 
  -webkit-backdrop-filter: blur(15px);
  
  background-color: rgba(255, 255, 255, 0.1); 
  
  border: 1px solid rgba(255, 255, 255, 0.2); 
  border-radius: 16px;
  
  color: #fff;
  text-decoration: none;
  font-size: 16px;
  font-weight: 500;
  
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  
  /* Змінений transition, щоб включити border-color та background-color */
  transition: transform 0.1s, background-color 0.2s, border-color 0.2s; 
  cursor: pointer;
  user-select: none;
}

a.btn {
  justify-content: center;
}

/* СТИЛЬ ПРИ НАТИСКАННІ (ТЕПЕР ДЛЯ ВСІХ) */
.btn:active {
  transform: scale(0.97);
  /* Зберігаємо зелений колір як основний "active" стан */
  background-color: rgba(46, 204, 113, 0.3);
  border-color: rgba(46, 204, 113, 0.7);
}

.icon-copy {
  font-size: 18px;
  opacity: 0.8;
}

</style>
</head>

<body>

<div id="background-image-wrap" role="img" aria-label="Fluid Background"></div>

<div class="container">
  <h1>💳 Перевести кошти</h1>
  <div class="subtitle">Оберіть зручний спосіб</div>

  <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK">monobank</a>

  <div class="btn" onclick="copyText('4441114459954077', this)">
    <span>💳 4441 •••• •••• 4077</span>
    <span class="icon-copy">📋</span>
  </div>
  <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK"> Apple Pay</a>
  <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK">Google Pay</a>
  <a class="btn" href="https://app.binance.com/uni-qr/LXViL5Hb">Binance Pay</a>
  <div class="btn" onclick="copyText('bc1qktmy8wcu3uvyugx3fgttg4t00akuvdk24anxcp', this)">
    <span>₿ Bitcoin (BTC)</span>
    <span class="icon-copy">📋</span>
  </div>
  <div class="btn" onclick="copyText('0xCcbD44EA963812ECc7F592a608245284c5cD87D9', this)">
    <span>◆ Ethereum</span>
    <span class="icon-copy">📋</span>
  </div>
  <div class="btn" onclick="copyText('TKobQmn3adNdXZ9aLfLhUe9bWF2pA9PhPh', this)">
    <span>₮ USDT Tron</span>

  </div>
  <div class="btn" onclick="copyText('EfwLdkavt2q59LfFnRjpVXQ9TpQiMpMnmJjbXUYLxps7', this)">
    <span>◎ Solana</span>
    <span class="icon-copy">📋</span>
  </div>
  <div class="btn" onclick="copyText('0xCcbD44EA963812ECc7F592a608245284c5cD87D9', this)">
    <span>◇ USDC (Polygon)</span>
    <span class="icon-copy">📋</span>
  </div>
  <a class="btn" href="https://link.trustwallet.com/send?address=0xCcbD44EA963812ECc7F592a608245284c5cD87D9" target="_blank">
     USDC (Polygon · Trust)
  </a>
</div>

<script>
// JS для копіювання: ВІН ТЕПЕР ПРОСТО ВИКОНУЄ ЛОГІКУ КОПІЮВАННЯ, А НЕ ВІЗУАЛЬНИЙ ЕФЕКТ
// Візуальний ефект на успішне копіювання ТАКОЖ залишаємо, він буде виглядати так само,
// але спрацює *після* копіювання.
function copyText(text, element) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => animateSuccess(element))
      .catch(() => fallbackCopy(text, element));
  } else {
    fallbackCopy(text, element);
  }
}

function fallbackCopy(text, element) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    animateSuccess(element);
  } catch (e) {}
  document.body.removeChild(ta);
}

// Функція animateSuccess тепер просто додає і видаляє клас, щоб імітувати
// "успішну дію" після копіювання.
function animateSuccess(el) {
  if (!el) return;
  // Клас `copied` застосовує зелені стилі
  el.classList.add('copied');
  
  setTimeout(() => {
    el.classList.remove('copied');
  }, 250);
}
</script>

<style>
.btn.copied {
  background-color: rgba(46, 204, 113, 0.3) !important;
  border-color: rgba(46, 204, 113, 0.7) !important;
  /* Запобігаємо спрацьовуванню :active стилю, коли цей клас активний */
  transform: scale(1); 
}
</style>

</body>
