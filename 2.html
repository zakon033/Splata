<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">

<title>Переказ коштів</title>

<style>
/* =========================
   1. БАЗА ТА ВИПРАВЛЕННЯ БІЛИХ СМУГ
========================= */
* {
  box-sizing: border-box;
}

html {
  /* Фарбуємо "дно" браузера в колір вашого фону.
     Тепер при відтягуванні сторінки не буде білого кольору. */
  background-color: #1b1f3b; 
  
  /* Забороняємо "гумовий" ефект прокрутки (коли сторінка відскакує) */
  overscroll-behavior-y: none; 
}

body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #ffffff;
  min-height: 100vh;
  /* Підстраховка кольору */
  background-color: #1b1f3b; 
}

/* =========================
   2. ФІКСОВАНИЙ ФОН
========================= */
.fixed-bg {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: -1;
  
  background-color: #1b1f3b;
  background-image: url("./bg-liquid.webp"); 
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  
  /* Цей хак допомагає на деяких мобільних прибрати мерехтіння */
  transform: translateZ(0); 
}

/* =========================
   3. КОНТЕЙНЕР
========================= */
.container {
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
  
  /* Додаємо відступ для безпечних зон (щоб текст не залазив під чубчик iPhone) */
  padding: 
    calc(40px + env(safe-area-inset-top)) 
    20px 
    calc(60px + env(safe-area-inset-bottom));
    
  text-align: center;
}

h1 {
  margin: 0 0 10px;
  font-size: 24px;
  font-weight: 600;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

.subtitle {
  margin-bottom: 30px;
  opacity: 0.9;
  font-size: 15px;
  text-shadow: 0 1px 5px rgba(0,0,0,0.2);
}

/* =========================
   4. ЕФЕКТ СКЛА
========================= */
.glass-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  
  margin-bottom: 12px;
  padding: 18px 20px;
  
  /* Посилюємо фон, щоб текст читався краще */
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 18px; /* Більш округлі кути */
  
  color: white;
  text-decoration: none;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  
  /* Тінь для глибини */
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  
  transition: all 0.2s ease;
  
  /* Забороняємо виділення тексту при кліках */
  user-select: none;
  -webkit-user-select: none; 
}

.glass-btn:active {
  transform: scale(0.97);
  background: rgba(255, 255, 255, 0.2);
}

.icon-copy {
  opacity: 0.7;
  font-size: 18px;
}

a.glass-btn {
  justify-content: center;
}
</style>
</head>

<body>

<script>
function copyText(text, element) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showCopiedEffect(element))
      .catch(() => fallbackCopyText(text, element));
  } else {
    fallbackCopyText(text, element);
  }
}

function fallbackCopyText(text, element) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  textArea.style.position = "fixed";
  textArea.style.left = "-9999px";
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  try {
    document.execCommand('copy');
    showCopiedEffect(element);
  } catch (err) {}
  document.body.removeChild(textArea);
}

function showCopiedEffect(element) {
  if (!element) return;
  const originalBackground = element.style.background;
  
  // Зелена індикація
  element.style.background = 'rgba(76, 175, 80, 0.5)';
  element.style.borderColor = 'rgba(76, 175, 80, 0.8)';
  
  setTimeout(() => {
    element.style.background = ''; // Повертаємо стилі CSS
    element.style.borderColor = '';
  }, 300);
}
</script>
