<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Перевод средств</title>

<meta name="theme-color" content="#1b1f3b"> 
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
<meta name="apple-mobile-web-app-capable" content="yes"> 

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; 
}
html { background-color: #1b1f3b; }
body {
  margin: 0; padding: 0; width: 100%; min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #ffffff; background: transparent !important; position: relative;
}
#background-image-wrap {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
  background-image: url("./bg-liquid.webp"); background-size: cover;
  background-position: center center; background-attachment: fixed; 
  transform: translateZ(0); 
  mask-image: linear-gradient(to bottom, transparent 0%, black 80px, black calc(100% - 80px), transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 80px, black calc(100% - 80px), transparent 100%);
}
.container {
  max-width: 420px; width: 100%; margin: 0 auto; position: relative;
  z-index: 10; padding: calc(60px + env(safe-area-inset-top)) 20px calc(60px + env(safe-area-inset-bottom)); 
  text-align: center;
}
h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.subtitle { font-size: 15px; opacity: 0.9; margin-bottom: 30px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

/* =========================
   КНОПКИ (БАЗОВЫЕ СТИЛИ)
========================= */
.btn {
  position: relative;
  overflow: hidden; 
  display: flex;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
  padding: 16px; 
  margin-bottom: 15px; 
  backdrop-filter: blur(15px); 
  -webkit-backdrop-filter: blur(15px);
  background-color: rgba(255, 255, 255, 0.1); 
  border: none; 
  border-radius: 70px; 
  color: #fff;
  text-decoration: none;
  font-size: 22px; 
  font-weight: 500;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: transform 0.1s, background-color 0.2s; 
  cursor: pointer;
  user-select: none;
}

/* Специальный класс для кнопок только с логотипом (на всю ширину) */
.btn-full-logo {
  justify-content: center !important;
  padding: 12px 0 !important;
}

.btn-full-logo svg {
  height: 42px; /* Фиксированная высота для гармонии */
  width: auto;
  max-width: 80%;
}

.btn-icon {
  width: 58px; height: 58px; margin-right: 15px; 
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 38px; 
}

.btn-icon svg { width: 100%; height: 100%; max-width: 58px; max-height: 58px; opacity: 0.9; }

.btn-text { text-align: left; white-space: nowrap; }

.card-number-font {
    font-family: 'Consolas', 'Courier New', monospace;
    color: rgba(255, 255, 255, 0.75); 
    text-shadow: 1px 1px 1.5px rgba(0, 0, 0, 1.0); 
}

/* Линии сверху и снизу */
.btn::before, .btn::after {
    content: ''; position: absolute; left: 0; width: 100%; height: 1.5px; z-index: 1;
}
.btn::before {
    top: 0; background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0) 100%);
}
.btn::after {
    bottom: 0; background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0) 100%);
}

.btn.clicked { transform: scale(0.97); background-color: rgba(46, 204, 113, 0.3); }

.btn.clicked::before, .btn.copied::before {
    background: linear-gradient(to right, rgba(46, 204, 113, 0) 0%, rgba(46, 204, 113, 0.6) 50%, rgba(46, 204, 113, 0) 100%);
}
.btn.clicked::after, .btn.copied::after {
     background: linear-gradient(to right, rgba(46, 204, 113, 0) 0%, rgba(46, 204, 113, 0.4) 50%, rgba(46, 204, 113, 0) 100%);
}

.btn.copied { background-color: rgba(46, 204, 113, 0.3) !important; }

/* УВЕДОМЛЕНИЕ */
#copy-toast {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, calc(-50% - 150px)); 
    padding: 16px 32px; border-radius: 70px;          
    background-color: rgba(255, 255, 255, 0.1); 
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    font-size: 22px; font-weight: 500; color: #ffffff; 
    z-index: 1000; opacity: 0; pointer-events: none;
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease-out;
}
#copy-toast.show { opacity: 1; transform: translate(-50%, -50%); background-color: rgba(46, 204, 113, 0.3); }
#copy-toast::before, #copy-toast::after { content: ''; position: absolute; left: 0; width: 100%; height: 1.5px; }
#copy-toast::before { top: 0; background: rgba(46, 204, 113, 0.6); }
#copy-toast::after { bottom: 0; background: rgba(46, 204, 113, 0.4); }
</style>
</head>

<div id="copy-toast">Скопировано!</div>

<script>
const CLICK_ANIM_TIME = 150; 
const TOAST_TIME = 2000; 

function animateClick(el) {
  return new Promise(res => {
    el.classList.add('clicked');
    setTimeout(() => { el.classList.remove('clicked'); res(); }, CLICK_ANIM_TIME);
  });
}

async function handleLinkClick(el) {
  event.preventDefault(); 
  const url = el.getAttribute('data-href');
  if (!url) return;
  await animateClick(el); 
  window.location.href = url;
}

async function handleCopyClick(el, text) {
  await animateClick(el);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showSuccess(el));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showSuccess(el);
  }
}

function showSuccess(el) {
  el.classList.add('copied');
  setTimeout(() => el.classList.remove('copied'), 250);
  const toast = document.getElementById('copy-toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), TOAST_TIME);
}
</script>
