<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Перевод средств</title>

<meta name="theme-color" content="#1b1f3b"> 
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
<meta name="apple-mobile-web-app-capable" content="yes"> 

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; 
}
html { background-color: #1b1f3b; }
body {
  margin: 0; padding: 0; width: 100%; min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #ffffff; background: transparent !important; position: relative;
}
#background-image-wrap {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
  background-image: url("./bg-liquid.webp"); background-size: cover;
  background-position: center center; background-attachment: fixed; 
  transform: translateZ(0); 
  mask-image: linear-gradient(to bottom, transparent 0%, black 80px, black calc(100% - 80px), transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 80px, black calc(100% - 80px), transparent 100%);
}
.container {
  max-width: 420px; width: 100%; margin: 0 auto; position: relative;
  z-index: 10; padding: calc(60px + env(safe-area-inset-top)) 20px calc(60px + env(safe-area-inset-bottom)); 
  text-align: center;
}
h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.subtitle { font-size: 15px; opacity: 0.9; margin-bottom: 30px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

/* Базовый стиль кнопки */
.btn {
  position: relative;
  overflow: hidden; 
  display: flex;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
  height: 64px; /* Фиксированная высота для всех кнопок */
  padding: 0 24px; 
  margin-bottom: 15px; 
  backdrop-filter: blur(15px); 
  -webkit-backdrop-filter: blur(15px);
  background-color: rgba(255, 255, 255, 0.1); 
  border: none; 
  border-radius: 70px; 
  color: #fff;
  text-decoration: none;
  font-size: 20px; 
  font-weight: 500;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: transform 0.1s, background-color 0.2s; 
  cursor: pointer;
}

/* Центрированная кнопка специально для Привата */
.btn-center {
  justify-content: center;
  padding: 0;
}

.btn-icon {
  width: 40px; height: 40px; margin-right: 15px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

.btn-icon svg { width: 100%; height: 100%; }

/* Контейнер для SVG Привата */
.privat-svg-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.privat-svg-container svg {
    height: 38px; /* Оптимальный размер, чтобы не ломать кнопку */
    width: auto;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
}

.card-number-font {
    font-family: 'Consolas', 'Courier New', monospace;
    letter-spacing: 1px;
}

/* Эффекты нажатия */
.btn.clicked { transform: scale(0.97); background-color: rgba(255, 255, 255, 0.2); }
.btn.copied { background-color: rgba(46, 204, 113, 0.3) !important; }

#copy-toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
    padding: 12px 24px; background: rgba(0,0,0,0.8); border-radius: 50px;
    z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s;
}
#copy-toast.show { opacity: 1; visibility: visible; }
</style>
</head>

<body>

<div id="background-image-wrap"></div>

<div class="container">
  <h1>💳 Перевести средства</h1>
  <div class="subtitle">Выберите удобный способ</div>

</div>

<div id="copy-toast">Скопировано!</div>

<script>
function animateClick(el) {
  return new Promise(res => {
    el.classList.add('clicked');
    setTimeout(() => { el.classList.remove('clicked'); res(); }, 150);
  });
}

async function handleLinkClick(el) {
  const url = el.getAttribute('data-href');
  await animateClick(el);
  window.location.href = url;
}

async function handleCopyClick(el, text) {
  await animateClick(el);
  navigator.clipboard.writeText(text).then(() => {
    el.classList.add('copied');
    const toast = document.getElementById('copy-toast');
    toast.classList.add('show');
    setTimeout(() => { 
        el.classList.remove('copied'); 
        toast.classList.remove('show');
    }, 2000);
  });
}
</script>
