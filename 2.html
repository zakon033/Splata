<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Переказ коштів</title>

<meta name="theme-color" content="#1b1f3b"> 
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
<meta name="apple-mobile-web-app-capable" content="yes"> 

<style>
/* =========================
   1. БАЗОВІ НАЛАШТУВАННЯ ТА ФОН (ШАР 1)
========================= */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; 
}

html {
  /* ТЕПЕР ФОНОВА КАРТИНКА ТА ГРАДІЄНТ ЖИВУТЬ ТУТ */
  background: 
    /* 1. Накладаємо градієнт для overscroll і глибини */
    linear-gradient(
      to bottom, 
      #1b1f3b 0%, 
      #3b3e5a 100% 
    ),
    /* 2. Додаємо фонове зображення */
    url("./bg-liquid.webp") center center / cover no-repeat;
    
  background-attachment: fixed; /* РОБИМО ФОН СТАТИЧНИМ */
  width: 100%;
  height: 100%;
}

body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #ffffff;
  
  /* ШАР 2: ПОВНІСТЮ ПРОЗОРИЙ */
  background: transparent !important; 
  position: relative;
}

/* =========================
   2. КОНТЕНТ (ШАР 3 - ПРОКРУЧУЄТЬСЯ)
========================= */
.container {
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
  
  background-color: transparent; 
  position: relative;
  z-index: 10; 
  
  padding: 
    calc(40px + env(safe-area-inset-top)) 
    20px 
    calc(60px + env(safe-area-inset-bottom));
    
  text-align: center;
}

/* Прибираємо елемент img, оскільки фон тепер на html */
#background-image {
  display: none;
}

h1 {
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 8px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.subtitle {
  font-size: 15px;
  opacity: 0.9;
  margin-bottom: 30px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* =========================
   3. КНОПКИ (BLUR)
========================= */
.btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 12px;
  padding: 18px 20px;
  
  backdrop-filter: blur(15px); 
  -webkit-backdrop-filter: blur(15px);
  
  background-color: rgba(255, 255, 255, 0.1); 
  
  border: 1px solid rgba(255, 255, 255, 0.2); 
  border-radius: 16px;
  
  color: #fff;
  text-decoration: none;
  font-size: 16px;
  font-weight: 500;
  
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  
  transition: transform 0.1s, background-color 0.2s;
  cursor: pointer;
  user-select: none;
}

a.btn {
  justify-content: center;
}

.btn:active {
  transform: scale(0.97);
  background-color: rgba(255, 255, 255, 0.2); 
}

/* =========================
   4. OVERLAY FADES (ЗАТІНЕННЯ КОНТЕНТУ)
========================= */
/* Градієнт зверху */
.container::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: calc(40px + env(safe-area-inset-top)); 
  z-index: 100; 
  pointer-events: none; 
  
  background: linear-gradient(
    to bottom, 
    #1b1f3b 0%, 
    rgba(27, 31, 59, 0.8) 50%, 
    transparent 100%
  );
}

/* Градієнт знизу */
.container::after {
  content: "";
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: calc(60px + env(safe-area-inset-bottom)); 
  z-index: 100;
  pointer-events: none;
  
  background: linear-gradient(
    to top, 
    #1b1f3b 0%, 
    rgba(27, 31, 59, 0.8) 50%,
    transparent 100%
  );
}
</style>
</head>

<body>

<img id="background-image" src="./bg-liquid.webp" alt="Fluid Background">

<div class="container">
  <h1>💳 Перевести кошти</h1>
  <div class="subtitle">Оберіть зручний спосіб</div>

  <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK">monobank</a>
  <a class="btn" href="https://www.privat24.ua/send/id4xg">ПриватБанк</a>
  <div class="btn" onclick="copyText('4441114459954077', this)">
    <span>💳 4441 •••• •••• 4077</span>
    <span class="icon-copy">📋</span>
  </div>
  <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK"> Apple Pay</a>
  <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK">Google Pay</a>
  <a class="btn" href="https://app.binance.com/uni-qr/LXViL5Hb">Binance Pay</a>
  <div class="btn" onclick="copyText('bc1qktmy8wcu3uvyugx3fgttg4t00akuvdk24anxcp', this)">
    <span>₿ Bitcoin (BTC)</span>
    <span class="icon-copy">📋</span>
  </div>
  <div class="btn" onclick="copyText('0xCcbD44EA963812ECc7F592a608245284c5cD87D9', this)">
    <span>◆ Ethereum</span>
    <span class="icon-copy">📋</span>
  </div>
  <div class="btn" onclick="copyText('TKobQmn3adNdXZ9aLfLhUe9bWF2pA9PhPh', this)">
    <span>₮ USDT Tron</span>
    <span class="icon-copy">📋</span>
  </div>
  <div class="btn" onclick="copyText('EfwLdkavt2q59LfFnRjpVXQ9TpQiMpMnmJjbXUYLxps7', this)">
    <span>◎ Solana</span>
    <span class="icon-copy">📋</span>
  </div>
  <div class="btn" onclick="copyText('0xCcbD44EA963812ECc7F592a608245284c5cD87D9', this)">
    <span>◇ USDC (Polygon)</span>
    <span class="icon-copy">📋</span>
  </div>
  <a class="btn" href="https://link.trustwallet.com/send?address=0xCcbD44EA963812ECc7F592a608245284c5cD87D9" target="_blank">
     USDC (Polygon · Trust)
  </a>
</div>

<script>
// JS залишається незмінним
function copyText(text, element) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => animateSuccess(element))
      .catch(() => fallbackCopy(text, element));
  } else {
    fallbackCopy(text, element);
  }
}

function fallbackCopy(text, element) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    animateSuccess(element);
  } catch (e) {}
  document.body.removeChild(ta);
}

function animateSuccess(el) {
  if (!el) return;
  const oldBg = el.style.backgroundColor;
  const oldBorder = el.style.borderColor;
  
  el.style.backgroundColor = 'rgba(46, 204, 113, 0.3)';
  el.style.borderColor = 'rgba(46, 204, 113, 0.7)';
  
  setTimeout(() => {
    el.style.backgroundColor = oldBg;
    el.style.borderColor = oldBorder;
  }, 250);
}
</script>

</body>
</html>
