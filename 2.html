<head>

<title>Переказ коштів</title>

<style>
/* =========================
   1. БАЗА
========================= */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #ffffff;
  /* Дозволяємо сторінці скролитися природно */
  min-height: 100vh;
}

/* =========================
   2. ФІКСОВАНИЙ ФОН
   (Найнадійніший метод для iOS/Android)
========================= */
.fixed-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background-color: #1b1f3b;
  background-image: url("./bg-liquid.webp"); 
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}

/* =========================
   3. КОНТЕЙНЕР
========================= */
.container {
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
  padding: 40px 20px 60px; /* Відступи зверху і знизу */
  text-align: center;
}

h1 {
  margin: 0 0 10px;
  font-size: 24px;
  font-weight: 600;
}

.subtitle {
  margin-bottom: 30px;
  opacity: 0.8;
  font-size: 15px;
}

/* =========================
   4. ЕФЕКТ СКЛА (Glassmorphism)
========================= */
.glass-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  
  margin-bottom: 12px;
  padding: 18px 20px;
  
  /* Скло */
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 16px;
  
  color: white;
  text-decoration: none;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  
  transition: background 0.2s, transform 0.1s;
}

/* Ефекти при наведенні/натисканні */
.glass-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.glass-btn:active {
  transform: scale(0.98);
  background: rgba(255, 255, 255, 0.25);
}

/* Іконка копіювання */
.icon-copy {
  opacity: 0.6;
  font-size: 18px;
}

/* Для посилань центруємо текст, якщо немає іконки праворуч */
a.glass-btn {
  justify-content: center;
}
</style>
</head>

<body>

<script>
function copyText(text, element) {
  // Сучасний API буфера обміну
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showCopiedEffect(element);
    }).catch(err => {
      console.error('Не вдалося скопіювати: ', err);
      fallbackCopyText(text, element);
    });
  } else {
    fallbackCopyText(text, element);
  }
}

// Fallback для старих браузерів
function fallbackCopyText(text, element) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  
  // Ховаємо поле, щоб не стрибала сторінка
  textArea.style.position = "fixed";
  textArea.style.left = "-9999px";
  
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  
  try {
    document.execCommand('copy');
    showCopiedEffect(element);
  } catch (err) {
    console.error('Fallback: Не вдалося скопіювати', err);
  }
  
  document.body.removeChild(textArea);
}

// Візуальний ефект успіху
function showCopiedEffect(element) {
  if (!element) return;
  
  const originalBackground = element.style.background;
  const originalBorder = element.style.borderColor;
  
  // Зеленуватий відтінок
  element.style.background = 'rgba(76, 175, 80, 0.4)';
  element.style.borderColor = 'rgba(76, 175, 80, 0.6)';
  
  setTimeout(() => {
    element.style.background = originalBackground;
    element.style.borderColor = originalBorder;
  }, 300);
}
</script>
