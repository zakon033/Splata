<style>
/* 1. БАЗОВЫЕ НАСТРОЙКИ */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; 
}
html { background-color: #1b1f3b; }
body {
  margin: 0; padding: 0; width: 100%; min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #ffffff; background: transparent !important; position: relative;
}

/* 2. ФОН (С КОРРЕКТНЫМ ПУТЕМ И МАСКОЙ) */
#background-image-wrap {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
  background-image: url("./bg-liquid.webp"); background-size: cover;
  background-position: center center; background-attachment: fixed; 
  transform: translateZ(0); 
  mask-image: linear-gradient(to bottom, transparent 0%, black 80px, black calc(100% - 80px), transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 80px, black calc(100% - 80px), transparent 100%);
}

.container {
  max-width: 420px; width: 100%; margin: 0 auto; position: relative;
  z-index: 10; padding: calc(60px + env(safe-area-inset-top)) 20px calc(60px + env(safe-area-inset-bottom)); 
  text-align: center;
}

h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.subtitle { font-size: 15px; opacity: 0.9; margin-bottom: 30px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

/* 3. КНОПКИ */
.btn {
  position: relative; overflow: hidden; display: flex; align-items: center; justify-content: flex-start;
  width: 100%; padding: 16px; margin-bottom: 15px; 
  backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  background-color: rgba(255, 255, 255, 0.1); border: none; border-radius: 70px; 
  color: #fff; text-decoration: none; font-size: 22px; font-weight: 500;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.1s, background-color 0.2s; 
  cursor: pointer; user-select: none;
}

/* Кнопка карты - центрирование */
.btn-card { justify-content: center !important; }
.btn-card .btn-text { text-align: center; width: 100%; margin: 0; }

.btn-icon {
  width: 58px; height: 58px; margin-right: 15px; 
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; 
}
.btn-icon svg { width: 100%; height: 100%; max-width: 58px; max-height: 58px; opacity: 0.9; }
.btn-text { text-align: left; white-space: nowrap; }

.card-number-font {
    font-family: 'Consolas', 'Courier New', monospace;
    font-weight: normal; letter-spacing: 2px; color: rgba(255, 255, 255, 0.9);
}

/* Свечение */
.btn::before, .btn::after { content: ''; position: absolute; left: 0; width: 100%; height: 1.5px; z-index: 1; }
.btn::before { top: 0; background: linear-gradient(to right, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%); }
.btn::after { bottom: 0; background: linear-gradient(to right, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%); }

.btn.clicked { transform: scale(0.97); background-color: rgba(46, 204, 113, 0.3); }
.btn.copied { background-color: rgba(46, 204, 113, 0.3) !important; }

/* 4. ТОСТ */
#copy-toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, calc(-50% - 150px)); 
    padding: 15px 30px; font-size: 22px; font-weight: 600; color: #ffffff; 
    background: rgba(0,0,0,0.8); border-radius: 50px;
    z-index: 1000; opacity: 0; pointer-events: none;
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease-out;
}
#copy-toast.show { opacity: 1; transform: translate(-50%, -50%); }

<script>
const CLICK_ANIMATION_DURATION = 150; 
const TOAST_DISPLAY_DURATION = 2000; 

function animateClick(element) {
  return new Promise(resolve => {
    element.classList.add('clicked');
    setTimeout(() => {
      element.classList.remove('clicked');
      resolve();
    }, CLICK_ANIMATION_DURATION);
  });
}

async function handleLinkClick(element) {
  event.preventDefault(); 
  const targetURL = element.getAttribute('data-href');
  if (!targetURL) return;
  await animateClick(element); 
  window.location.href = targetURL;
}

async function handleCopyClick(element, textToCopy) {
  await animateClick(element);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(textToCopy)
      .then(() => animateSuccess(element))
      .catch(() => fallbackCopy(textToCopy, element));
  } else {
    fallbackCopy(textToCopy, element);
  }
}

function fallbackCopy(text, element) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); animateSuccess(element); } catch (e) {}
  document.body.removeChild(ta);
}

function animateSuccess(el) {
  el.classList.add('copied');
  setTimeout(() => el.classList.remove('copied'), 250);
  const toast = document.getElementById('copy-toast');
  toast.classList.add('show'); 
  setTimeout(() => toast.classList.remove('show'), TOAST_DISPLAY_DURATION);
}
</script>
