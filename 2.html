<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Переказ коштів</title>

<style>
/* =========================
   1. БАЗОВІ НАЛАШТУВАННЯ
========================= */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; /* Прибирає синій клік на Android */
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  
  /* Фарбуємо в темний колір, щоб при відтягуванні не було білого */
  background-color: #1b1f3b;
  color: #ffffff;
}

/* =========================
   2. ФОНОВЕ ЗОБРАЖЕННЯ
========================= */
.bg-layer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1; /* Відправляємо на самий задній план */
  
  /* Вкажіть правильний шлях до картинки */
  background-image: url("./bg-liquid.webp");
  background-position: center center;
  background-size: cover;
  background-repeat: no-repeat;
  
  /* Якщо картинки немає, буде просто гарний градієнт */
  background-color: #1b1f3b; 
}

/* =========================
   3. КОНТЕЙНЕР (СКРОЛЛ)
========================= */
.container {
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
  
  /* Відступи з урахуванням "чубчика" iPhone */
  padding: 
    calc(40px + env(safe-area-inset-top)) 
    20px 
    calc(60px + env(safe-area-inset-bottom));
    
  text-align: center;
}

h1 {
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 8px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.subtitle {
  font-size: 15px;
  opacity: 0.9;
  margin-bottom: 30px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* =========================
   4. КНОПКИ (ШВИДКИЙ СТИЛЬ)
========================= */
.btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 12px;
  padding: 18px 20px;
  
  /* Напівпрозорий фон БЕЗ блюра для швидкості */
  background-color: rgba(30, 35, 60, 0.65);
  
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 16px;
  
  color: #fff;
  text-decoration: none;
  font-size: 16px;
  font-weight: 500;
  
  /* Легка тінь */
  box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  
  /* Плавна анімація */
  transition: transform 0.1s, background-color 0.2s;
  cursor: pointer;
  user-select: none;
}

/* Центруємо текст у посилань */
a.btn {
  justify-content: center;
}

/* Ефект натискання */
.btn:active {
  transform: scale(0.97);
  background-color: rgba(30, 35, 60, 0.85);
}

.icon-copy {
  font-size: 18px;
  opacity: 0.8;
}

/* Спеціальний стиль для Trust Wallet посилання */
.btn-trust {
  margin-top: 12px;
  background-color: rgba(50, 115, 220, 0.2); /* Трохи синюватий */
  border-color: rgba(50, 115, 220, 0.4);
}
</style>
</head>

<body>

<div class="bg-layer"></div>

<div class="container">
  <h1>💳 Перевести кошти</h1>
  <div class="subtitle">Оберіть зручний спосіб</div>

  <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK">monobank</a>
  <a class="btn" href="https://www.privat24.ua/send/id4xg">ПриватБанк</a>

  <div class="btn" onclick="copyText('4441114459954077', this)">
    <span>💳 4441 •••• •••• 4077</span>
    <span class="icon-copy">📋</span>
  </div>

  <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK"> Apple Pay</a>
  <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK">Google Pay</a>
  <a class="btn" href="https://app.binance.com/uni-qr/LXViL5Hb">Binance Pay</a>

  <div class="btn" onclick="copyText('bc1qktmy8wcu3uvyugx3fgttg4t00akuvdk24anxcp', this)">
    <span>₿ Bitcoin (BTC)</span>
    <span class="icon-copy">📋</span>
  </div>

  <div class="btn" onclick="copyText('0xCcbD44EA963812ECc7F592a608245284c5cD87D9', this)">
    <span>◆ Ethereum</span>
    <span class="icon-copy">📋</span>
  </div>

  <div class="btn" onclick="copyText('TKobQmn3adNdXZ9aLfLhUe9bWF2pA9PhPh', this)">
    <span>₮ USDT Tron</span>
    <span class="icon-copy">📋</span>
  </div>

  <div class="btn" onclick="copyText('EfwLdkavt2q59LfFnRjpVXQ9TpQiMpMnmJjbXUYLxps7', this)">
    <span>◎ Solana</span>
    <span class="icon-copy">📋</span>
  </div>

  <div class="btn" onclick="copyText('0xCcbD44EA963812ECc7F592a608245284c5cD87D9', this)">
    <span>◇ USDC (Polygon)</span>
    <span class="icon-copy">📋</span>
  </div>
  
  <a class="btn btn-trust" href="https://link.trustwallet.com/send?address=0xCcbD44EA963812ECc7F592a608245284c5cD87D9" target="_blank">
     USDC (Polygon · Trust)
  </a>
</div>

<script>
function copyText(text, element) {
  // Проста та надійна функція копіювання
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => animateSuccess(element))
      .catch(() => fallbackCopy(text, element));
  } else {
    fallbackCopy(text, element);
  }
}

function fallbackCopy(text, element) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    animateSuccess(element);
  } catch (e) {}
  document.body.removeChild(ta);
}

function animateSuccess(el) {
  if (!el) return;
  const oldBg = el.style.backgroundColor;
  const oldBorder = el.style.borderColor;
  
  // Зелена індикація
  el.style.backgroundColor = 'rgba(46, 204, 113, 0.5)';
  el.style.borderColor = 'rgba(46, 204, 113, 0.8)';
  
  setTimeout(() => {
    el.style.backgroundColor = oldBg;
    el.style.borderColor = oldBorder;
  }, 250);
}
</script>

</body>
</html>
