<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Переказ коштів</title>

<meta name="theme-color" content="#1b1f3b"> 
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
<meta name="apple-mobile-web-app-capable" content="yes"> 

<style>
/* =========================
   1. БАЗОВІ НАЛАШТУВАННЯ ТА ВИПРАВЛЕННЯ СМУГ
========================= */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; 
}

html {
  background-color: #1b1f3b; 
}

body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #ffffff;
  background: transparent !important; 
  position: relative;
}

/* =========================
   2. ФОНОВЕ ЗОБРАЖЕННЯ
========================= */
#background-image {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1; 
  object-fit: cover;
  transform: translateZ(0); 
}

/* =========================
   3. КОНТЕЙНЕР (ПРОКРУЧУВАНИЙ КОНТЕНТ)
========================= */
.container {
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
  background-color: transparent; 
  position: relative;
  
  /* ЗБІЛЬШУЄМО Z-INDEX, ЩОБ ПЕРЕКРИТИ ШАР ЗАТІНЕННЯ */
  z-index: 100; 
  
  /* ДОЗВОЛЯЄМО КОНТЕНТУ ПРОКРУЧУВАТИСЯ ВИСОКО */
  padding: 
    20px 
    20px 
    calc(60px + env(safe-area-inset-bottom)); 
    
  text-align: center;
}

/* КОРЕКЦІЯ: ВИКОРИСТОВУЄМО PADDING НА ЗАГОЛОВКУ, ЩОБ ВІН ПОЧИНАВСЯ ПІСЛЯ СТАТУСБАРУ */
.container h1 {
    padding-top: env(safe-area-inset-top); 
    
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 8px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.subtitle {
  font-size: 15px;
  opacity: 0.9;
  margin-bottom: 30px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* =========================
   4. КНОПКИ (BLUR) (Без змін)
========================= */
/* ... Стилі кнопок без змін ... */
.btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 12px;
  padding: 18px 20px;
  
  backdrop-filter: blur(15px); 
  -webkit-backdrop-filter: blur(15px);
  
  background-color: rgba(255, 255, 255, 0.1); 
  
  border: 1px solid rgba(255, 255, 255, 0.2); 
  border-radius: 16px;
  
  color: #fff;
  text-decoration: none;
  font-size: 16px;
  font-weight: 500;
  
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  
  transition: transform 0.1s, background-color 0.2s;
  cursor: pointer;
  user-select: none;
}

a.btn {
  justify-content: center;
}

.btn:active {
  transform: scale(0.97);
  background-color: rgba(255, 255, 255, 0.2); 
}

.icon-copy {
  font-size: 18px;
  opacity: 0.8;
}


/* =========================
   5. НОВИЙ ШАР ЗАТІНЕННЯ (FADES OVERLAY)
   Залишаємо його дуже низьким, щоб він лише покривав фон, але був нижче контенту
========================= */
#fades-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%; 
    
    /* ЗНИЖУЄМО Z-INDEX. Він має бути вищий за фон (-1), але нижчий за контент (100) */
    z-index: 5; 
    pointer-events: none; 
    
    background: 
        /* Верхнє затемнення: Зберігаємо темний колір у зоні статусбару */
        linear-gradient(
            to bottom, 
            #1b1f3b 0%, 
            rgba(27, 31, 59, 0.8) 
            calc(env(safe-area-inset-top) + 20px), /* Затемнення до 20px нижче статусбару */
            transparent 
            calc(env(safe-area-inset-top) + 60px) /* Перехід у прозорий за 40px */
        ),
        /* Нижнє затемнення: Симетрично знизу */
        linear-gradient(
            to top, 
            #1b1f3b 0%, 
            rgba(27, 31, 59, 0.8) 
            calc(env(safe-area-inset-bottom) + 20px),
            transparent 
            calc(env(safe-area-inset-bottom) + 60px)
        );
}
</style>
</head>

<script>
// JS залишається незмінним
function copyText(text, element) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => animateSuccess(element))
      .catch(() => fallbackCopy(text, element));
  } else {
    fallbackCopy(text, element);
  }
}

function animateSuccess(el) {
  if (!el) return;
  const oldBg = el.style.backgroundColor;
  const oldBorder = el.style.borderColor;
  
  el.style.backgroundColor = 'rgba(46, 204, 113, 0.3)';
  el.style.borderColor = 'rgba(46, 204, 113, 0.7)';
  
  setTimeout(() => {
    el.style.backgroundColor = oldBg;
    el.style.borderColor = oldBorder;
  }, 250);
}
</script>
