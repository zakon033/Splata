<style>
/* =========================
   1. БАЗОВІ НАЛАШТУВАННЯ ТА ВИПРАВЛЕННЯ СМУГ
========================= */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; 
}

html {
  background-color: #1b1f3b; 
}

body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #ffffff;
  background: transparent !important; 
  position: relative;
}

/* =========================
   2. ФОНОВЕ ЗОБРАЖЕННЯ 
========================= */
#background-image-wrap {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1; 
  
  background-image: url("./bg-liquid.webp");
  background-size: cover;
  background-position: center center;
  background-attachment: fixed; 
  
  transform: translateZ(0); 
  -webkit-transform: translateZ(0);

  /* ГРАДІЄНТНА МАСКА */
  mask-image: linear-gradient(
    to bottom, 
    transparent 0%, 
    rgba(0, 0, 0, 0) calc(env(safe-area-inset-top) + 10px), 
    black calc(env(safe-area-inset-top) + 60px), 
    black calc(100% - 60px - env(safe-area-inset-bottom)), 
    rgba(0, 0, 0, 0) calc(100% - 10px - env(safe-area-inset-bottom)), 
    transparent 100% 
  );
  -webkit-mask-image: linear-gradient(
    to bottom, 
    transparent 0%, 
    rgba(0, 0, 0, 0) calc(env(safe-area-inset-top) + 10px), 
    black calc(env(safe-area-inset-top) + 60px), 
    black calc(100% - 60px - env(safe-area-inset-bottom)), 
    rgba(0, 0, 0, 0) calc(100% - 10px - env(safe-area-inset-bottom)), 
    transparent 100% 
  );
}

/* =========================
   3. КОНТЕЙНЕР (ПРОКРУЧУВАНИЙ КОНТЕНТ)
========================= */
.container {
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
  
  background-color: transparent; 
  position: relative;
  z-index: 10; 
  
  transform: translateZ(0); 
  -webkit-transform: translateZ(0);

  padding: 
    calc(60px + env(safe-area-inset-top)) 
    20px 
    calc(60px + env(safe-area-inset-bottom)); 
    
  text-align: center;
}

h1 {
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 8px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.subtitle {
  font-size: 15px;
  opacity: 0.9;
  margin-bottom: 30px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* =========================
   4. КНОПКИ (BLUR)
========================= */
.btn {
  position: relative;
  overflow: hidden; 
  
  display: flex;
  align-items: center;
  justify-content: center;
  
  margin-bottom: 15px; 
  
  backdrop-filter: blur(15px); 
  -webkit-backdrop-filter: blur(15px);
  
  background-color: rgba(255, 255, 255, 0.1); 
  
  border: none; 
  
  border-radius: 70px; 
  
  color: #fff;
  text-decoration: none;
  
  font-size: 22px;
  font-weight: 500;
  
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  
  transition: transform 0.1s, background-color 0.2s; 
  cursor: pointer;
  user-select: none;
}

/* НОВИЙ СТИЛЬ: ШРИФТ ДЛЯ НОМЕРА КАРТКИ */
.card-number-font {
    /* Використовуємо моноширинний шрифт для імітації гравіювання */
    font-family: 'Consolas', 'Courier New', monospace;
    /* Збільшуємо міжбуквений інтервал для кращого візуального ефекту */
    letter-spacing: 2px;
}


/* СВІТІННЯ КОРДОНІВ */
.btn::before,
.btn::after {
    content: '';
    position: absolute;
    left: 0;
    width: 100%;
    height: 1.5px; 
    z-index: 1;
}

/* ВЕРХНЯ ЛІНІЯ (СВІТЛА ВГОРІ) */
.btn::before {
    top: 0;
    background: linear-gradient(
        to right, 
        rgba(255, 255, 255, 0) 0%, 
        rgba(255, 255, 255, 0.3) 25%, 
        rgba(255, 255, 255, 0.5) 50%, 
        rgba(255, 255, 255, 0.3) 75%, 
        rgba(255, 255, 255, 0) 100%
    );
}

/* НИЖНЯ ЛІНІЯ (ТРОХИ ТЕМНІША) */
.btn::after {
    bottom: 0;
    background: linear-gradient(
        to right, 
        rgba(255, 255, 255, 0) 0%, 
        rgba(255, 255, 255, 0.1) 25%, 
        rgba(255, 255, 255, 0.2) 50%, 
        rgba(255, 255, 255, 0.1) 75%, 
        rgba(255, 255, 255, 0) 100%
    );
}


/* СТИЛІ РОЗМІРУ ТІЛЬКИ ДЛЯ СПРАВЖНІХ КНОПОК */
.btn:not(#copy-toast) {
    width: 100%;
    padding: 24px 20px; 
}

a.btn {
  justify-content: center;
}

/* КОРИГУВАННЯ ДЛЯ КНОПОК З ІКОНКОЮ КОПІЮВАННЯ */
.btn > span {
    margin: 0 8px;
}
.btn > span:first-child {
    margin-left: 0;
}
.btn > span:last-child {
    margin-right: 0;
}


/* СТИЛЬ НАТИСКАННЯ: ЗЕЛЕНЕ СВІТІННЯ (ВИКОРИСТОВУЄТЬСІЯ І ДЛЯ ТОСТУ) */
.btn.clicked {
  transform: scale(0.97);
  background-color: rgba(46, 204, 113, 0.3);
}

/* ПЕРЕВИЗНАЧАЄМО СВІТІННЯ ДЛЯ НАТИСНУТОЇ/СКОПІЙОВАНОЇ КНОПКИ */
.btn.clicked::before, 
.btn.copied::before {
    background: linear-gradient(
        to right, 
        rgba(46, 204, 113, 0) 0%, 
        rgba(46, 204, 113, 0.6) 50%, 
        rgba(46, 204, 113, 0) 100%
    );
}
.btn.clicked::after,
.btn.copied::after {
     background: linear-gradient(
        to right, 
        rgba(46, 204, 113, 0) 0%, 
        rgba(46, 204, 113, 0.4) 50%, 
        rgba(46, 204, 113, 0) 100%
    );
}


/* СТИЛЬ УСПІШНОГО КОПІЮВАННЯ (ВИКОРИСТОВУЄТЬСЯ І ДЛЯ ТОСТУ) */
.btn.copied {
  transform: scale(1);
  background-color: rgba(46, 204, 113, 0.3) !important;
}

.icon-copy {
  font-size: 22px; 
  opacity: 0.8;
  margin-left: 10px; 
}

/* =========================
   5. ТОСТ-УВЕДОМЛЕНИЕ О КОПИРОВАНИИ
========================= */
#copy-toast {
    position: fixed;
    top: 50%; 
    left: 50%;
    
    transform: translate(-50%, calc(-50% - 150px)); 
    
    padding: 15px 30px; 
    font-size: 22px; 
    font-weight: 600;
    color: #ffffff; 
    
    z-index: 1000; 
    
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease-out;
}

#copy-toast.show {
    opacity: 1;
    transform: translate(-50%, -50%); 
}
</style>

<script>
// ===================================
// УНІВЕРСАЛЬНІ ФУНКЦІЇ ДЛЯ КНОПОК
// ===================================

const CLICK_ANIMATION_DURATION = 150; 
const TOAST_DISPLAY_DURATION = 2000; 

// 1. Анімація натискання (універсальна)
function animateClick(element) {
  return new Promise(resolve => {
    element.classList.add('clicked');
    
    setTimeout(() => {
      element.classList.remove('clicked');
      resolve();
    }, CLICK_ANIMATION_DURATION);
  });
}

// 2. Обробник для посилань (<a>)
async function handleLinkClick(element) {
  event.preventDefault(); 
  
  const targetURL = element.getAttribute('data-href');
  if (!targetURL) return;

  await animateClick(element); 
  
  window.location.href = targetURL;
}


// 3. Обробник для копіювання (<div>)
async function handleCopyClick(element, textToCopy) {
  await animateClick(element);
  
  if (navigator.clipboard) {
    navigator.clipboard.writeText(textToCopy)
      .then(() => animateSuccess(element))
      .catch(() => fallbackCopy(textToCopy, element));
  } else {
    fallbackCopy(textToCopy, element);
  }
}

// 4. Логіка копіювання (для сумісності)
function fallbackCopy(text, element) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    animateSuccess(element);
  } catch (e) {}
  document.body.removeChild(ta);
}

// 5. Візуалізація успіху (включає тост)
function animateSuccess(el) {
  if (!el) return;
  
  // 1. Зелена вспышка кнопки
  el.classList.add('copied');
  setTimeout(() => {
    el.classList.remove('copied');
  }, 250);

  // 2. Показ тост-уведомления
  const toast = document.getElementById('copy-toast');
  if (toast) {
    toast.classList.add('btn', 'clicked', 'show');
    
    // Скрываем тост через заданное время
    setTimeout(() => {
      toast.classList.remove('btn', 'clicked', 'show');
    }, TOAST_DISPLAY_DURATION);
  }
}
</script>
