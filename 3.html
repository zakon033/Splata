<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Перевод средств</title>

<meta name="theme-color" content="#1b1f3b"> 
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
<meta name="apple-mobile-web-app-capable" content="yes"> 

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; 
}
html { background-color: #1b1f3b; }
body {
  margin: 0; padding: 0; width: 100%; min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #ffffff; background: transparent !important; position: relative;
}
#background-image-wrap {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
  background-image: url("./bg-liquid.webp"); background-size: cover;
  background-position: center center; background-attachment: fixed; 
  transform: translateZ(0); 
  mask-image: linear-gradient(to bottom, transparent 0%, black 80px, black calc(100% - 80px), transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 80px, black calc(100% - 80px), transparent 100%);
}
.container {
  max-width: 420px; width: 100%; margin: 0 auto; position: relative;
  z-index: 10; padding: calc(60px + env(safe-area-inset-top)) 20px calc(60px + env(safe-area-inset-bottom)); 
  text-align: center;
}
h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.subtitle { font-size: 15px; opacity: 0.9; margin-bottom: 30px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

/* =========================
   КНОПКИ
========================= */
.btn {
  position: relative;
  overflow: hidden; 
  display: flex;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
  padding: 16px; 
  margin-bottom: 15px; 
  backdrop-filter: blur(15px); 
  -webkit-backdrop-filter: blur(15px);
  background-color: rgba(255, 255, 255, 0.1); 
  border: none; 
  border-radius: 70px; 
  color: #fff;
  text-decoration: none;
  font-size: 22px; 
  font-weight: 500;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: transform 0.1s, background-color 0.2s; 
  cursor: pointer;
  user-select: none;
}

.btn-icon {
  width: 58px;  
  height: 58px; 
  margin-right: 15px; 
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0; 
  font-size: 38px; 
}

.btn-icon svg {
    width: 100%; 
    height: 100%; 
    max-width: 58px;
    max-height: 58px;
    opacity: 0.9;
}

.btn-text {
  text-align: left;
  white-space: nowrap;
}

.card-number-font {
    font-family: 'Consolas', 'Courier New', monospace;
    font-weight: normal; 
    letter-spacing: 2px; 
    color: rgba(255, 255, 255, 0.75); 
    text-shadow: 1px 1px 1.5px rgba(0, 0, 0, 1.0), -1px -1px 1.5px rgba(255, 255, 255, 0.5); 
}

.btn::before, .btn::after {
    content: ''; position: absolute; left: 0; width: 100%; height: 1.5px; z-index: 1;
}
.btn::before {
    top: 0; background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.3) 25%, rgba(255, 255, 255, 0.5) 50%, rgba(255, 255, 255, 0.3) 75%, rgba(255, 255, 255, 0) 100%);
}
.btn::after {
    bottom: 0; background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.1) 25%, rgba(255, 255, 255, 0.2) 50%, rgba(255, 255, 255, 0.1) 75%, rgba(255, 255, 255, 0) 100%);
}

.btn.clicked {
  transform: scale(0.97); background-color: rgba(46, 204, 113, 0.3);
}

.btn.clicked::before, .btn.copied::before {
    background: linear-gradient(to right, rgba(46, 204, 113, 0) 0%, rgba(46, 204, 113, 0.6) 50%, rgba(46, 204, 113, 0) 100%);
}
.btn.clicked::after, .btn.copied::after {
     background: linear-gradient(to right, rgba(46, 204, 113, 0) 0%, rgba(46, 204, 113, 0.4) 50%, rgba(46, 204, 113, 0) 100%);
}

.btn.copied {
  transform: scale(1); background-color: rgba(46, 204, 113, 0.3) !important;
}

#copy-toast {
    position: fixed;
    top: 50%; 
    left: 50%;
    transform: translate(-50%, calc(-50% - 150px)); 
    width: auto;                  
    white-space: nowrap;          
    padding: 16px 32px;           
    border-radius: 70px;          
    background-color: rgba(255, 255, 255, 0.1); 
    backdrop-filter: blur(15px);  
    -webkit-backdrop-filter: blur(15px);
    border: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    overflow: hidden; 
    font-size: 22px; 
    font-weight: 500;
    color: #ffffff; 
    z-index: 1000; 
    pointer-events: none;         
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                opacity 0.3s ease-out, 
                background-color 0.2s;
}

#copy-toast::before, #copy-toast::after {
    content: ''; position: absolute; left: 0; width: 100%; height: 1.5px; z-index: 1;
}
#copy-toast::before {
    top: 0; background: linear-gradient(to right, rgba(46, 204, 113, 0) 0%, rgba(46, 204, 113, 0.6) 50%, rgba(46, 204, 113, 0) 100%);
}
#copy-toast::after {
    bottom: 0; background: linear-gradient(to right, rgba(46, 204, 113, 0) 0%, rgba(46, 204, 113, 0.4) 50%, rgba(46, 204, 113, 0) 100%);
}

#copy-toast.show {
    opacity: 1;
    transform: translate(-50%, -50%);
    background-color: rgba(46, 204, 113, 0.3); 
}
</style>
</head>

<body>

<div id="background-image-wrap"></div>

<div class="container">
  <h1>💳 Перевести средства</h1>
  <div class="subtitle">Выберите удобный способ</div>

  <a class="btn" data-href="https://send.monobank.ua/5a2bBZvgLK" onclick="handleLinkClick(this)">
    <div class="btn-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
            <defs>
                <linearGradient id="a_mono" x1="0%" x2="100%" y1="0%" y2="100%">
                    <stop offset="0%" stop-color="#FF3A83"/>
                    <stop offset="100%" stop-color="#9C27B0"/>
                </linearGradient>
            </defs>
            <path fill="url(#a_mono)" d="M31.11 15.939C31.11 7.643 24.385.875 16.055.875 7.726.875.999 7.643.999 15.939c0 8.295 6.727 15.063 15.056 15.063 8.33 0 15.055-6.768 15.055-15.063z"/>
            <path fill="#fff" d="M10.157 20.306c0 1.25.962 1.884 2.88 1.884 1.918 0 2.88-1.077 2.88-2.61v-5.066h-2.103v4.673c0 .307-.153.511-.458.511-.304 0-.457-.204-.457-.511v-4.673H9.99V25h2.102v-4.694c0 .358.122.56.365.607 1.828.303 2.255.668 2.255 1.639 0 .97-.853 1.638-2.011 1.638-1.585 0-2.133-.667-2.316-1.578-.06-.242-.244-.364-.427-.364h-1.036a.416.416 0 00-.426.425v.06c.243 1.518 1.219 2.61 3.23 2.914v1.457c0 .242.183.425.487.485h.915c.243 0 .426-.182.487-.485V20.34c1.829-.303 3.047-1.578 3.047-3.217z M18.17 14.653c0-2.272-1.74-3.488-4.61-3.488h-2.103v16.148h2.103V15.75c0-1.228.85-1.928 2.37-1.928 1.52 0 2.37.7 2.37 1.928v11.954h2.103V14.653h-2.103zM25.85 11.233h2.103V25h-2.103V11.233z" transform="scale(0.55) translate(15, 7.5)"/>
        </svg>

  <a class="btn" data-href="https://www.privat24.ua/send/id4xg" onclick="handleLinkClick(this)">
    <div class="btn-icon">
        <svg viewBox="0 0 35 35" xmlns="http://www.w3.org/2000/svg"><path d="M17.5 0C7.8 0 0 7.8 0 17.5S7.8 35 17.5 35 35 27.2 35 17.5 27.2 0 17.5 0zm6.9 23.3h-3.9v-7.1c0-1.5-.6-2.3-1.8-2.3-1.2 0-1.9.8-1.9 2.3v7.1h-3.9V12.1h3.9v1.2c.6-.9 1.6-1.5 2.9-1.5 2.4 0 3.7 1.6 3.7 4.1v7.4z" fill="#7ab72b"/></svg>
    </div>

  <div class="btn" onclick="handleCopyClick(this, '4441114459954077')">
    <div class="btn-icon">💳</div>

  </div>
  
  <a class="btn" data-href="https://send.monobank.ua/5a2bBZvgLK" onclick="handleLinkClick(this)">
    <div class="btn-icon"></div>
    <span class="btn-text"> Apple Pay</span>

  <a class="btn" data-href="https://send.monobank.ua/5a2bBZvgLK" onclick="handleLinkClick(this)">

  </a>
  
  <a class="btn" data-href="https://app.binance.com/uni-qr/LXViL5Hb" onclick="handleLinkClick(this)">

        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><g fill="none"><circle cx="16" cy="15" r="15" fill="#F3BA2F"/><path d="M12.116 13.404L16 9.52l3.886 3.886 2.26-2.26L16 5l-6.144 6.144 2.26 2.26zM6 15l2.26-2.26L10.52 15l-2.26 2.26L6 15zm6.116 1.596L16 20.48l3.886-3.886 2.26 2.259L16 25l-6.144-6.144-.003-.003 2.263-2.257zM21.48 15l2.26-2.26L26 15l-2.26 2.26L21.48 15zm-3.188-.002h.002V15L16 17.294l-2.291-2.29-.004-.004.004-.003.401-.402.195-.195L16 12.706l2.293 2.293z" fill="#FFF"/></g></svg>
    </div>
    <span class="btn-text">Binance Pay</span>
  </a>
</div>

<div id="copy-toast">Скопировано!</div>

<script>
const CLICK_ANIMATION_DURATION = 150; 
const TOAST_DISPLAY_DURATION = 2000; 

function animateClick(element) {
  return new Promise(resolve => {
    element.classList.add('clicked');
    setTimeout(() => {
      element.classList.remove('clicked');
      resolve();
    }, CLICK_ANIMATION_DURATION);
  });
}

async function handleLinkClick(element) {
  event.preventDefault(); 
  const targetURL = element.getAttribute('data-href');
  if (!targetURL) return;
  await animateClick(element); 
  window.location.href = targetURL;
}

async function handleCopyClick(element, textToCopy) {
  await animateClick(element);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(textToCopy)
      .then(() => animateSuccess(element))
      .catch(() => fallbackCopy(textToCopy, element));
  } else {
    fallbackCopy(textToCopy, element);
  }
}

function fallbackCopy(text, element) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    animateSuccess(element);
  } catch (e) {}
  document.body.removeChild(ta);
}

function animateSuccess(el) {
  if (!el) return;
  el.classList.add('copied');
  setTimeout(() => {
    el.classList.remove('copied');
  }, 250);
  
  const toast = document.getElementById('copy-toast');
  if (toast) {
    toast.classList.add('show'); 
    setTimeout(() => {
      toast.classList.remove('show');
    }, TOAST_DISPLAY_DURATION);
  }
}
</script>

</body>
</html>
