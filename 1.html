<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Переказ коштів</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
            position: relative;
            background: 
                linear-gradient(rgba(10, 30, 15, 0.85), rgba(5, 20, 10, 0.9)),
                url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-1.2.1&auto=format&fit=crop&w=2000&q=80&blur=100');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Эффект стекла для ВСЕХ элементов */
        .glass-effect {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px) url(#liquidFilter);
            -webkit-backdrop-filter: blur(25px) url(#liquidFilter);
            box-shadow: 
                0 10px 35px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
            background: linear-gradient(90deg, #fff, #c8ffc8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .small {
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Секции */
        .section {
            padding: 25px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .section:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* КНОВКИ с эффектом стекла */
        .btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            text-decoration: none;
            padding: 18px 28px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
            margin: 0 12px 16px 0;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px) url(#liquidFilter);
            -webkit-backdrop-filter: blur(25px) url(#liquidFilter);
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            min-width: 180px;
        }

        /* Эффект свечения при наведении на кнопки */
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.1), 
                transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 
                0 12px 30px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* Блоки для копирования с эффектом стекла */
        .copy {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) url(#liquidFilter);
            -webkit-background-filter: blur(25px) url(#liquidFilter);
        }

        .copy:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateX(5px);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .copy span:last-child {
            font-size: 1.3rem;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .copy:hover span:last-child {
            opacity: 1;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .section {
                padding: 20px;
            }
            
            .btn {
                display: block;
                width: 100%;
                margin-right: 0;
                margin-bottom: 12px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .section {
                padding: 18px;
            }
            
            .btn {
                padding: 16px;
                font-size: 1rem;
            }
        }
    </style>
</head>

    <script>
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                // Виброотклик
                if (navigator.vibrate) navigator.vibrate(50);
                
                // Красивое уведомление
                const notification = document.createElement('div');
                notification.textContent = '✓ Скопійовано';
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: rgba(30, 60, 40, 0.95);
                    color: white;
                    padding: 14px 24px;
                    border-radius: 14px;
                    font-weight: 600;
                    z-index: 1000;
                    border: 1px solid rgba(255, 255, 255, 0.2);
                    backdrop-filter: blur(20px);
                    -webkit-backdrop-filter: blur(20px);
                    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                    animation: slideIn 0.3s ease, fadeOut 0.3s ease 2s forwards;
                `;
                
                document.body.appendChild(notification);
                
                setTimeout(() => notification.remove(), 2300);
            }).catch(err => {
                alert('Не вдалося скопіювати. Спробуйте ще раз.');
            });
        }

        // Добавляем стили для анимации
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { opacity: 0; transform: translateY(-20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            @keyframes fadeOut {
                from { opacity: 1; transform: translateY(0); }
                to { opacity: 0; transform: translateY(-20px); }
            }
        `;
        document.head.appendChild(style);
    </script>
