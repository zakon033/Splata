<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Переказ коштів</title>

<style>
/* =========================
   1. БАЗОВЫЙ СБРОС
========================= */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden; /* Убираем скролл у body */
}

/* =========================
   2. ОСНОВНОЙ ФОН
========================= */
body {
  background-color: #1b1f3b; /* fallback цвет */
  position: relative;
}

/* Статичное фоновое изображение */
body::before {
  content: "";
  position: fixed; /* Фиксируем фон */
  top: -10px; /* Расширяем за пределы экрана */
  left: -10px;
  right: -10px;
  bottom: -10px; /* Убираем белые полосы */
  z-index: -1; /* Отправляем фон на задний план */
  
  background-color: #1b1f3b;
  background-image: url("./bg-liquid.webp"); 
  background-repeat: no-repeat;
  background-position: center;
  background-size: cover;
  background-attachment: scroll; /* Важно для мобильных */
  
  /* Гарантируем, что фон не будет двигаться */
  -webkit-transform: translateZ(0);
  transform: translateZ(0);
}

/* =========================
   3. КОНТЕЙНЕР С ПРОКРУТКОЙ
========================= */
.container {
  max-width: 420px;
  width: 100%; 
  margin: 0 auto;
  padding: 24px 16px 40px;
  
  /* Делаем контейнер прокручиваемым */
  height: 100vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch; /* Плавный скролл на iOS */
  
  /* Убираем полосы прокрутки для чистоты дизайна */
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* IE и Edge */
}

/* Скрываем скроллбар в Webkit браузерах */
.container::-webkit-scrollbar {
  display: none;
}

/* =========================
   4. ЗАГОЛОВКИ
========================= */
h1 {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 600;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}

.small {
  font-size: 14px;
  opacity: 0.85;
  margin-bottom: 24px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}

/* =========================
   5. СЕКЦИИ
========================= */
.section {
  display: grid;
  gap: 14px;
  margin-bottom: 30px;
}

/* =========================
   6. СТЕКЛЯННЫЕ ЭЛЕМЕНТЫ
========================= */
.btn,
.copy {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 20px 18px; 
  border-radius: 48px; 

  /* ВАЖНО: фон есть всегда */
  background-color: rgba(255,255,255,0.15);

  /* Safari iOS */
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  backdrop-filter: blur(18px) saturate(170%);

  color: #ffffff;
  font-size: 16px;
  font-weight: 500;
  text-decoration: none;

  border: none;
  outline: none;
  cursor: pointer;

  box-shadow:
    0 8px 25px rgba(0,0,0,0.25),
    inset 0 1px 1px rgba(255,255,255,0.25),
    0 0 0 1px rgba(255,255,255,0.1); /* Легкая обводка */

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    background-color .15s ease;
}

/* Улучшение для ссылок */
.btn {
  text-align: center;
}

/* =========================
   7. МАСКА (НЕРОВНЫЙ КРАЙ)
========================= */
@supports (-webkit-mask-image: url("")) {
  .btn,
  .copy {
    -webkit-mask-image: url("./mask/glass-edge.webp");
    -webkit-mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
  }
}

/* =========================
   8. ПОДСВЕТКА КРАЯ
========================= */
.btn::after,
.copy::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;

  background:
    radial-gradient(
      at 30% 20%,
      rgba(255,255,255,0.35),
      transparent 60%
    );

  mix-blend-mode: overlay;
  opacity: 0.7;
}

/* =========================
   9. НАЖАТИЕ (iOS)
========================= */
.btn:active,
.copy:active {
  transform: scale(0.97);
  background-color: rgba(255,255,255,0.12);
  box-shadow:
    0 4px 15px rgba(0,0,0,0.3),
    inset 0 1px 2px rgba(255,255,255,0.2);
}

/* =========================
   10. COPY - специальные стили
========================= */
.copy {
  cursor: pointer;
}

.copy span:last-child {
  opacity: 0.8;
  font-size: 18px;
}

/* =========================
   11. ПОДСКАЗКИ ПРИ ПРОКРУТКЕ
========================= */
/* Плавное затемнение сверху */
.container::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 80px;
  background: linear-gradient(to bottom, 
    rgba(27, 31, 59, 0.9) 0%, 
    rgba(27, 31, 59, 0.4) 80%,
    transparent 100%);
  pointer-events: none;
  z-index: 1;
}

/* Плавное затемнение снизу */
.container::after {
  content: "";
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 80px;
  background: linear-gradient(to top, 
    rgba(27, 31, 59, 0.9) 0%, 
    rgba(27, 31, 59, 0.4) 80%,
    transparent 100%);
  pointer-events: none;
  z-index: 1;
}

/* =========================
   12. АДАПТИВНЫЕ ПРАВКИ
========================= */
@media (max-height: 700px) {
  .container {
    padding: 20px 16px 30px;
  }
  
  .btn,
  .copy {
    padding: 16px 18px;
  }
  
  .section {
    gap: 12px;
  }
}

/* Для очень высоких экранов */
@media (min-height: 900px) {
  .container {
    padding: 32px 16px 50px;
  }
  
  .section {
    gap: 16px;
  }
}
</style>
</head>

<body>

<script>
function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      // Визуальная обратная связь
      event.target.style.backgroundColor = 'rgba(76, 175, 80, 0.3)';
      setTimeout(function() {
        event.target.style.backgroundColor = '';
      }, 300);
    });
  } else {
    // Fallback для старых браузеров
    const textArea = document.createElement('textarea');
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.select();
    document.execCommand('copy');
    document.body.removeChild(textArea);
    
    // Визуальная обратная связь
    event.target.style.backgroundColor = 'rgba(76, 175, 80, 0.3)';
    setTimeout(function() {
      event.target.style.backgroundColor = '';
    }, 300);
  }
}

// Улучшенная обработка для iOS
if (navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
  // Предотвращаем стандартное поведение жестов
  document.addEventListener('touchmove', function(e) {
    if (e.target.closest('.container')) {
      return; // Разрешаем скролл в контейнере
    }
  }, { passive: true });
  
  // Гарантируем, что фон остается на месте
  document.body.style.webkitBackfaceVisibility = 'hidden';
  document.body.style.transform = 'translate3d(0,0,0)';
}
</script>
