<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Переказ коштів</title>
    <style>
        /* Основные сбросы и фон */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, 
                #1a3a1a 0%, 
                #2d5a2d 25%, 
                #1a472a 50%, 
                #0f3d2d 75%, 
                #163a1f 100%);
            min-height: 100vh;
            padding: 20px;
            color: rgba(255, 255, 255, 0.9);
            position: relative;
            overflow-x: hidden;
        }

        /* Декоративные элементы фона */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 200, 120, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(100, 180, 100, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(80, 160, 80, 0.1) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* Контейнер */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Заголовок */
        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #ffffff, #e0ffe0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .small {
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.5px;
        }

        /* Эффект жидкого стекла для секций */
        .section {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(40px) url(#liquidFilter);
            -webkit-backdrop-filter: blur(40px) url(#liquidFilter);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
            padding: 28px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .section:hover {
            background: rgba(255, 255, 255, 0.11);
            transform: translateY(-2px);
            box-shadow: 
                0 15px 50px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
        }

        .section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.4), 
                transparent);
        }

        /* Кнопки */
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            color: white;
            text-decoration: none;
            padding: 18px 28px;
            border-radius: 18px;
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
            margin: 0 12px 16px 0;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
            box-shadow: 
                0 6px 20px rgba(46, 204, 113, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -2px 0 rgba(0, 0, 0, 0.1);
            min-width: 180px;
            letter-spacing: 0.3px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 10px 25px rgba(46, 204, 113, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 -2px 0 rgba(0, 0, 0, 0.1);
            background: linear-gradient(90deg, #34d178, #2ecc71);
        }

        .btn:active {
            transform: translateY(-1px);
            box-shadow: 
                0 4px 15px rgba(46, 204, 113, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        /* Блоки для копирования */
        .copy {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1.05rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .copy:hover {
            background: rgba(0, 0, 0, 0.35);
            transform: translateX(3px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .copy span:last-child {
            font-size: 1.3rem;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .copy:hover span:last-child {
            opacity: 1;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .section {
                padding: 22px;
                margin-bottom: 20px;
            }
            
            .btn {
                display: block;
                width: 100%;
                margin-right: 0;
                margin-bottom: 12px;
                min-width: auto;
            }
            
            .copy {
                padding: 16px 18px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .section {
                padding: 18px;
                border-radius: 22px;
            }
            
            .btn {
                padding: 16px;
                font-size: 1rem;
            }
        }
    </style>
</head>

    <script>
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                // Виброотклик на поддерживающих устройствах
                if (navigator.vibrate) navigator.vibrate(50);
                
                // Временное уведомление вместо alert
                const notification = document.createElement('div');
                notification.textContent = 'Скопійовано: ' + text;
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: rgba(46, 204, 113, 0.95);
                    color: white;
                    padding: 12px 20px;
                    border-radius: 12px;
                    font-weight: 600;
                    z-index: 1000;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                    backdrop-filter: blur(10px);
                    -webkit-backdrop-filter: blur(10px);
                    animation: fadeInOut 2.5s ease;
                `;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.style.animation = 'fadeOut 0.5s ease forwards';
                    setTimeout(() => notification.remove(), 500);
                }, 2000);
            }).catch(err => {
                console.error('Не вдалося скопіювати: ', err);
                alert('Не вдалося скопіювати. Спробуйте ще раз.');
            });
        }

        // Добавляем стили для анимации уведомления
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInOut {
                0% { opacity: 0; transform: translateY(-20px); }
                15% { opacity: 1; transform: translateY(0); }
                85% { opacity: 1; transform: translateY(0); }
                100% { opacity: 0; transform: translateY(-20px); }
            }
            @keyframes fadeOut {
                from { opacity: 1; transform: translateY(0); }
                to { opacity: 0; transform: translateY(-20px); }
            }
        `;
        document.head.appendChild(style);
    </script>
