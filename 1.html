<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #000; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  
  .container {
    position: relative;
    width: 800px; height: 600px;
    background: linear-gradient(135deg, #1a0033, #c1272d, #4a148c);
    display: flex; justify-content: center; align-items: center;
  }

  /* Слой 1: Чистый текст */
  .base-text {
    position: absolute;
    color: white; font-family: sans-serif; font-size: 110px; font-weight: 900;
    letter-spacing: -5px; opacity: 0.3;
  }

  /* Слой 2: Искаженный текст (виден только через линзы) */
  .distorted-layer {
    position: absolute;
    width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;
    filter: url(#lens-warp); /* Применяем искажение здесь */
    clip-path: url(#lens-mask); /* Вырезаем по форме линз */
    -webkit-clip-path: url(#lens-mask);
  }

  .dist-text {
    color: white; font-family: sans-serif; font-size: 110px; font-weight: 900;
    letter-spacing: -5px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="base-text">IPHONE 16</div>

  <div class="distorted-layer">
    <div class="dist-text">IPHONE 16</div>
  </div>
</div>

<svg width="0" height="0" style="position: absolute;">
  <defs>
    <filter id="lens-warp">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="100" />
    </filter>

    <clipPath id="lens-mask" clipPathUnits="objectBoundingBox">
      <circle cx="0.5" cy="0.5" r="0.2" transform="translate(-0.2, -0.1)">
        <animateTransform attributeName="transform" type="translate" dur="7s" 
          values="-0.3,-0.1; 0.3,0.2; -0.3,-0.1" repeatCount="indefinite" additive="sum" />
      </circle>
      <circle cx="0.5" cy="0.5" r="0.15" transform="translate(0.1, 0.2)">
        <animateTransform attributeName="transform" type="translate" dur="5s" 
          values="0.3,0.1; -0.3,-0.2; 0.3,0.1" repeatCount="indefinite" additive="sum" />
      </circle>
    </clipPath>
  </defs>
</svg>

</body>
</html>
