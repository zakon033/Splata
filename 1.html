<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Переказ коштів</title>
  <style>
    /* Стили, приведённые выше */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      text-align: center;
      text-decoration: none;
      color: white;
      font-weight: 600;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .section {
      margin: 20px 0;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .copy {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      margin: 10px 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .copy:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💳 Перевести кошти</h1>
    <div class="small">Оберіть зручний спосіб</div>

    <!-- Банки -->
    <div class="section">
      <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK">monobank</a>
      <a class="btn" href="https://www.privat24.ua/send/id4xg">ПриватБанк</a>
      <div class="copy" onclick="copyText('4441114459954077')">
        <span>💳 4441 •••• •••• 4077</span>
        <span>📋</span>
      </div>
    </div>

    <!-- Apple / Google Pay через monobank -->
    <div class="section">
      <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK"> Apple Pay</a>
      <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK">Google Pay</a>
    </div>

    <!-- Binance -->
    <div class="section">
      <a class="btn" href="https://app.binance.com/uni-qr/LXViL5Hb">Binance Pay</a>
    </div>

    <!-- Crypto -->
    <div class="section">
      <div class="copy" onclick="copyText('bc1qktmy8wcu3uvyugx3fgttg4t00akuvdk24anxcp')">
        ₿ Bitcoin (BTC) <span>📋</span>
      </div>
      <div class="copy" onclick="copyText('0xCcbD44EA963812ECc7F592a608245284c5cD87D9')">
        ◆ Ethereum (Ethereum) <span>📋</span>
      </div>
      <div class="copy" onclick="copyText('TKobQmn3adNdXZ9aLfLhUe9bWF2pA9PhPh')">
        ₮ USDT Tron <span>📋</span>
      </div>
      <div class="copy" onclick="copyText('EfwLdkavt2q59LfFnRjpVXQ9TpQiMpMnmJjbXUYLxps7')">
        ◎ Solana (SOL) <span>📋</span>
      </div>
      <div class="copy" onclick="copyText('0xCcbD44EA963812ECc7F592a608245284c5cD87D9')">
        ◇ USDC (Polygon) <span>📋</span>
      </div>
      <a class="btn"
         href="https://link.trustwallet.com/send?address=0xCcbD44EA963812ECc7F592a608245284c5cD87D9&asset=c966_t0x576Cf361711cd940CD9C397BB98C4C896cBd38De"
         target="_blank" rel="noopener">
         USDC (Polygon · Trust)
      </a>
    </div>
  </div>

  <script>
    function copyText(text) {
      navigator.clipboard.writeText(text);
      navigator.vibrate?.(20);
      alert('Скопійовано: ' + text);
    }

    // Анимация при прокрутке
    const animateOnScroll = () => {
      const elements = document.querySelectorAll('.section, .btn, .copy');
      elements.forEach((element) => {
        const elementPosition = element.getBoundingClientRect().top;
        const screenPosition = window.innerHeight / 1.3;
        if (elementPosition < screenPosition) {
          element.style.opacity = '1';
          element.style.transform = 'translateY(0)';
        }
      });
    };

    document.querySelectorAll('.section, .btn, .copy').forEach((element) => {
      element.style.opacity = '0';
      element.style.transform = 'translateY(20px)';
      element.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
    });

    window.addEventListener('scroll', animateOnScroll);
    window.addEventListener('load', animateOnScroll);
  </script>
</body>
</html>
