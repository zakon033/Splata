<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { filter: saturate(1.1) contrast(1.1); }
    </style>
</head>
<body>

<canvas id="lensCanvas"></canvas>

<script>
const canvas = document.getElementById('lensCanvas');
const ctx = canvas.getContext('2d');

const width = 800;
const height = 600;
canvas.width = width;
canvas.height = height;

// Буфер для хранения текущего состояния кадра перед наложением очередной линзы
const tempCanvas = document.createElement('canvas');
tempCanvas.width = width;
tempCanvas.height = height;
const tCtx = tempCanvas.getContext('2d');

const bgCanvas = document.createElement('canvas');
bgCanvas.width = width;
bgCanvas.height = height;
const bgCtx = bgCanvas.getContext('2d');

function drawStaticBackground() {
    const grad = bgCtx.createLinearGradient(0, 0, width, height);
    grad.addColorStop(0, '#1a0033');
    grad.addColorStop(0.5, '#c1272d');
    grad.addColorStop(1, '#4a148c');
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, width, height);
    
    bgCtx.fillStyle = 'white';
    bgCtx.font = '900 120px -apple-system, sans-serif';
    bgCtx.textAlign = 'center';
    bgCtx.textBaseline = 'middle';
    bgCtx.globalAlpha = 0.5;
    bgCtx.fillText('IPHONE 16', width/2, height/2);
}

const lenses = [
    { x: 200, y: 200, r: 140, sx: 1.2, sy: 0.9, id: 'Нижняя' },
    { x: 600, y: 400, r: 120, sx: -1.0, sy: -1.3, id: 'Средняя' },
    { x: 400, y: 300, r: 160, sx: 0.6, sy: -0.8, id: 'Верхняя' }
];

function applyRefraction(lens, source) {
    const x = Math.floor(lens.x);
    const y = Math.floor(lens.y);
    const r = lens.r;
    const step = 2; 

    for (let i = -r; i < r; i += step) {
        for (let j = -r; j < r; j += step) {
            const dist = Math.sqrt(i * i + j * j);
            if (dist < r) {
                const refraction = Math.pow(dist / r, 0.6);
                const sourceX = x + i * refraction;
                const sourceY = y + j * refraction;
                
                // Рисуем в основной контекст, беря данные из временного буфера
                ctx.drawImage(source, sourceX, sourceY, step, step, x + i, y + j, step, step);
            }
        }
    }
}

function drawLensVfx(lens) {
    const x = Math.floor(lens.x);
    const y = Math.floor(lens.y);
    const r = lens.r;

    // Голубое свечение
    const blueGrad = ctx.createRadialGradient(x, y, 0, x, y, r);
    blueGrad.addColorStop(0, 'rgba(0, 150, 255, 0)');
    blueGrad.addColorStop(0.7, 'rgba(0, 120, 255, 0.1)');
    blueGrad.addColorStop(0.96, 'rgba(0, 180, 255, 0.3)');
    blueGrad.addColorStop(1, 'rgba(0, 180, 255, 0)');
    ctx.fillStyle = blueGrad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // Тонкая белая кайма
    const whiteEdge = ctx.createRadialGradient(x, y, r - 2, x, y, r + 1);
    whiteEdge.addColorStop(0, 'rgba(255, 255, 255, 0)');
    whiteEdge.addColorStop(0.5, 'rgba(255, 255, 255, 0.7)');
    whiteEdge.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = whiteEdge;
    ctx.beginPath();
    ctx.arc(x, y, r + 1, 0, Math.PI * 2);
    ctx.fill();
}

function render() {
    // 1. Начинаем с чистого фона
    ctx.drawImage(bgCanvas, 0, 0);

    lenses.forEach((lens, index) => {
        // Двигаем линзу
        lens.x += lens.sx;
        lens.y += lens.sy;
        if (lens.x < 100 || lens.x > width - 100) lens.sx *= -1;
        if (lens.y < 100 || lens.y > height - 100) lens.sy *= -1;

        // СОХРАНЯЕМ текущее состояние холста (то, что под линзой) в буфер
        tCtx.clearRect(0, 0, width, height);
        tCtx.drawImage(canvas, 0, 0);

        // 2. Применяем искажение к текущему холсту, используя буфер
        applyRefraction(lens, tempCanvas);

        // 3. Рисуем визуальные эффекты линзы поверх искажения
        drawLensVfx(lens);
    });

    requestAnimationFrame(render);
}

drawStaticBackground();
render();
</script>

</body>
</html>
