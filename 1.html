<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Переказ коштів</title>
<style>
body {
  margin: 0;
  padding: 20px;
  font-family: sans-serif;
  background: url('https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=1600&blur=50') fixed;
  background-size: cover;
  min-height: 100vh;
}

.container {
  max-width: 600px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  color: white;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  margin-bottom: 5px;
}

.small {
  text-align: center;
  color: rgba(255,255,255,0.8);
  margin-bottom: 30px;
}

/* ЭФФЕКТ СТЕКЛА - как в статье */
.glass {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(20px) url(#liquidFilter);
  -webkit-backdrop-filter: blur(20px) url(#liquidFilter);
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}

/* Кнопки */
.btn {
  display: block;
  background: rgba(255, 255, 255, 0.15);
  color: white;
  text-decoration: none;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 10px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
}

/* Блоки для копирования */
.copy {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  cursor: pointer;
  border: 1px solid rgba(255, 255, 255, 0.15);
}
</style>
</head>

<body>

<!-- SVG фильтр для жидкого стекла -->
<svg style="display:none">
  <filter id="liquidFilter">
    <feTurbulence type="turbulence" baseFrequency="0.01" numOctaves="1" result="turbulence"/>
    <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="container">
  <h1>💳 Перевести кошти</h1>
  <div class="small">Оберіть зручний спосіб</div>

  <div class="glass">
    <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK">monobank</a>
    <a class="btn" href="https://www.privat24.ua/send/id4xg">ПриватБанк</a>
    
    <div class="copy" onclick="copyText('4441114459954077')">
      <span>💳 4441 •••• •••• 4077</span>
      <span>📋</span>
    </div>
  </div>

  <div class="glass">
    <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK"> Apple Pay</a>
    <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK">Google Pay</a>
  </div>

  <div class="glass">
    <a class="btn" href="https://app.binance.com/uni-qr/LXViL5Hb">Binance Pay</a>
  </div>

  <div class="glass">
    <div class="copy" onclick="copyText('bc1qktmy8wcu3uvyugx3fgttg4t00akuvdk24anxcp')">
      <span>₿ Bitcoin (BTC)</span><span>📋</span>
    </div>
    <div class="copy" onclick="copyText('0xCcbD44EA963812ECc7F592a608245284c5cD87D9')">
      <span>◆ Ethereum</span><span>📋</span>
    </div>
    <div class="copy" onclick="copyText('TKobQmn3adNdXZ9aLfLhUe9bWF2pA9PhPh')">
      <span>₮ USDT Tron</span><span>📋</span>
    </div>
    <div class="copy" onclick="copyText('EfwLdkavt2q59LfFnRjpVXQ9TpQiMpMnmJjbXUYLxps7')">
      <span>◎ Solana</span><span>📋</span>
    </div>
    <div class="copy" onclick="copyText('0xCcbD44EA963812ECc7F592a608245284c5cD87D9')">
      <span>◇ USDC</span><span>📋</span>
    </div>
    
    <a class="btn" href="https://link.trustwallet.com/send?address=0xCcbD44EA963812ECc7F592a608245284c5cD87D9&asset=c966_t0x576Cf361711cd940CD9C397BB98C4C896cBd38De">
      USDC (Polygon · Trust)
    </a>
  </div>
</div>

<script>
function copyText(text) {
  navigator.clipboard.writeText(text);
  navigator.vibrate?.(20);
  
  // Маленькое уведомление
  const msg = document.createElement('div');
  msg.textContent = 'Скопійовано';
  msg.style.cssText = 'position:fixed; top:20px; right:20px; background:green; color:white; padding:10px 20px; border-radius:8px;';
  document.body.appendChild(msg);
  setTimeout(() => msg.remove(), 1500);
}
</script>
</body>
</html>
