<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Переказ коштів</title>

<meta name="theme-color" content="#1b1f3b"> 
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
<meta name="apple-mobile-web-app-capable" content="yes"> 

<style>
/* =========================
   1. БАЗОВІ НАЛАШТУВАННЯ ТА ВИПРАВЛЕННЯ СМУГ
========================= */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; 
}

html {
  background-color: #1b1f3b; 
}

body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  color: #ffffff;
  background: transparent !important; 
  position: relative;
}

/* =========================
   2. ФОНОВЕ ЗОБРАЖЕННЯ 
========================= */
#background-image-wrap {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1; 
  
  background-image: url("./bg-liquid.webp");
  background-size: cover;
  background-position: center center;
  background-attachment: fixed; 
  
  transform: translateZ(0); 
  -webkit-transform: translateZ(0);

  /* ГРАДІЄНТНА МАСКА */
  mask-image: linear-gradient(
    to bottom, 
    transparent 0%, 
    rgba(0, 0, 0, 0) calc(env(safe-area-inset-top) + 10px), 
    black calc(env(safe-area-inset-top) + 60px), 
    black calc(100% - 60px - env(safe-area-inset-bottom)), 
    rgba(0, 0, 0, 0) calc(100% - 10px - env(safe-area-inset-bottom)), 
    transparent 100% 
  );
  -webkit-mask-image: linear-gradient(
    to bottom, 
    transparent 0%, 
    rgba(0, 0, 0, 0) calc(env(safe-area-inset-top) + 10px), 
    black calc(env(safe-area-inset-top) + 60px), 
    black calc(100% - 60px - env(safe-area-inset-bottom)), 
    rgba(0, 0, 0, 0) calc(100% - 10px - env(safe-area-inset-bottom)), 
    transparent 100% 
  );
}

/* =========================
   3. КОНТЕЙНЕР (ПРОКРУЧУВАНИЙ КОНТЕНТ)
========================= */
.container {
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
  
  background-color: transparent; 
  position: relative;
  z-index: 10; 
  
  transform: translateZ(0); 
  -webkit-transform: translateZ(0);

  padding: 
    calc(60px + env(safe-area-inset-top)) 
    20px 
    calc(60px + env(safe-area-inset-bottom)); 
    
  text-align: center;
}

h1 {
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 8px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.subtitle {
  font-size: 15px;
  opacity: 0.9;
  margin-bottom: 30px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* =========================
   4. КНОПКИ (BLUR)
========================= */
.btn {
  position: relative;
  overflow: hidden; 
  
  display: flex;
  align-items: center;
  justify-content: space-between;
  
  /* ЗМІНЕНО: ІНТЕРВАЛ МІЖ КНОПКАМИ ЗМЕНШЕНО В 2 РАЗИ (з 30px до 15px) */
  margin-bottom: 15px; 
  
  backdrop-filter: blur(15px); 
  -webkit-backdrop-filter: blur(15px);
  
  background-color: rgba(255, 255, 255, 0.1); 
  
  border: none; 
  
  border-radius: 70px; 
  
  color: #fff;
  text-decoration: none;
  font-size: 16px;
  font-weight: 500;
  
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  
  transition: transform 0.1s, background-color 0.2s; 
  cursor: pointer;
  user-select: none;
}

/* СВІТІННЯ КОРДОНІВ */
.btn::before,
.btn::after {
    content: '';
    position: absolute;
    left: 0;
    width: 100%;
    height: 1.5px; 
    z-index: 1;
}

/* ВЕРХНЯ ЛІНІЯ (СВІТЛА ВГОРІ) */
.btn::before {
    top: 0;
    background: linear-gradient(
        to right, 
        rgba(255, 255, 255, 0) 0%, 
        rgba(255, 255, 255, 0.3) 25%, 
        rgba(255, 255, 255, 0.5) 50%, 
        rgba(255, 255, 255, 0.3) 75%, 
        rgba(255, 255, 255, 0) 100%
    );
}

/* НИЖНЯ ЛІНІЯ (ТРОХИ ТЕМНІША) */
.btn::after {
    bottom: 0;
    background: linear-gradient(
        to right, 
        rgba(255, 255, 255, 0) 0%, 
        rgba(255, 255, 255, 0.1) 25%, 
        rgba(255, 255, 255, 0.2) 50%, 
        rgba(255, 255, 255, 0.1) 75%, 
        rgba(255, 255, 255, 0) 100%
    );
}


/* СТИЛІ РОЗМІРУ ТІЛЬКИ ДЛЯ СПРАВЖНІХ КНОПОК */
.btn:not(#copy-toast) {
    width: 100%;
    /* ЗМІНЕНО: ВИСОТА КНОПОК ЗБІЛЬШЕНА НА 8% (з 22px до 24px) */
    padding: 24px 20px; 
}

a.btn {
  justify-content: center;
}

/* СТИЛЬ НАТИСКАННЯ: ЗЕЛЕНЕ СВІТІННЯ (ВИКОРИСТОВУЄТЬСІЯ І ДЛЯ ТОСТУ) */
.btn.clicked {
  transform: scale(0.97);
  background-color: rgba(46, 204, 113, 0.3);
}

/* ПЕРЕВИЗНАЧАЄМО СВІТІННЯ ДЛЯ НАТИСНУТОЇ/СКОПІЙОВАНОЇ КНОПКИ */
.btn.clicked::before, 
.btn.copied::before {
    background: linear-gradient(
        to right, 
        rgba(46, 204, 113, 0) 0%, 
        rgba(46, 204, 113, 0.6) 50%, 
        rgba(46, 204, 113, 0) 100%
    );
}
.btn.clicked::after,
.btn.copied::after {
     background: linear-gradient(
        to right, 
        rgba(46, 204, 113, 0) 0%, 
        rgba(46, 204, 113, 0.4) 50%, 
        rgba(46, 204, 113, 0) 100%
    );
}


/* СТИЛЬ УСПІШНОГО КОПІЮВАННЯ (ВИКОРИСТОВУЄТЬСЯ І ДЛЯ ТОСТУ) */
.btn.copied {
  transform: scale(1);
  background-color: rgba(46, 204, 113, 0.3) !important;
}

.icon-copy {
  font-size: 18px;
  opacity: 0.8;
}

/* =========================
   5. ТОСТ-УВЕДОМЛЕНИЕ О КОПИРОВАНИИ
========================= */
#copy-toast {
    position: fixed;
    top: 50%; 
    left: 50%;
    
    transform: translate(-50%, calc(-50% - 150px)); 
    
    padding: 15px 30px; 
    font-size: 20px;     
    font-weight: 600;
    color: #ffffff; 
    
    z-index: 1000; 
    
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease-out;
}

#copy-toast.show {
    opacity: 1;
    transform: translate(-50%, -50%); 
}
</style>
</head>

<body>

<div id="background-image-wrap" role="img" aria-label="Fluid Background"></div>

<div class="container">
  <h1>💳 Перевести кошти</h1>
  <div class="subtitle">Оберіть зручний спосіб</div>

  <a class="btn" data-href="https://send.monobank.ua/5a2bBZvgLK" onclick="handleLinkClick(this)">monobank</a>
  <a class="btn" data-href="https://www.privat24.ua/send/id4xg" onclick="handleLinkClick(this)">ПриватБанк</a>
  
  <div class="btn" onclick="handleCopyClick(this, '4441114459954077')">
    <span>💳 4441 •••• •••• 4077</span>
    <span class="icon-copy">📋</span>
  </div>
  
  <a class="btn" data-href="https://send.monobank.ua/5a2bBZvgLK" onclick="handleLinkClick(this)"> Apple Pay</a>
  <a class="btn" data-href="https://send.monobank.ua/5a2bBZvgLK" onclick="handleLinkClick(this)">Google Pay</a>
  <a class="btn" data-href="https://app.binance.com/uni-qr/LXViL5Hb" onclick="handleLinkClick(this)">Binance Pay</a>
  
  <div class="btn" onclick="handleCopyClick(this, 'bc1qktmy8wcu3uvyugx3fgttg4t00akuvdk24anxcp')">
    <span>₿ Bitcoin (BTC)</span>
    <span class="icon-copy">📋</span>
  </div>
  <div class="btn" onclick="handleCopyClick(this, '0xCcbD44EA963812ECc7F592a608245284c5cD87D9')">
    <span>◆ Ethereum</span>
    <span class="icon-copy">📋</span>
  </div>
  <div class="btn" onclick="handleCopyClick(this, 'TKobQmn3adNdXZ9aLfLhUe9bWF2pA9PhPh')">
    <span>₮ USDT Tron</span>
    <span class="icon-copy">📋</span>
  </div>
  <div class="btn" onclick="handleCopyClick(this, 'EfwLdkavt2q59LfFnRjpVXQ9TpQiMpMnmJjbXUYLxps7')">
    <span>◎ Solana</span>
    <span class="icon-copy">📋</span>
  </div>
  <div class="btn" onclick="handleCopyClick(this, '0xCcbD44EA963812ECc7F592a608245284c5cD87D9')">
    <span>◇ USDC (Polygon)</span>
    <span class="icon-copy">📋</span>
  </div>
  <a class="btn" data-href="https://link.trustwallet.com/send?address=0xCcbD44EA963812ECc7F592a608245284c5cD87D9" target="_blank" onclick="handleLinkClick(this)">
     USDC (Polygon · Trust)
  </a>
</div>

<div id="copy-toast">Скопировано!</div>

<script>
// ===================================
// УНІВЕРСАЛЬНІ ФУНКЦІЇ ДЛЯ КНОПОК
// ===================================

const CLICK_ANIMATION_DURATION = 150; 
const TOAST_DISPLAY_DURATION = 2000; 

// 1. Анімація натискання (універсальна)
function animateClick(element) {
  return new Promise(resolve => {
    element.classList.add('clicked');
    
    setTimeout(() => {
      element.classList.remove('clicked');
      resolve();
    }, CLICK_ANIMATION_DURATION);
  });
}

// 2. Обробник для посилань (<a>)
async function handleLinkClick(element) {
  event.preventDefault(); 
  
  const targetURL = element.getAttribute('data-href');
  if (!targetURL) return;

  await animateClick(element); 
  
  window.location.href = targetURL;
}


// 3. Обробник для копіювання (<div>)
async function handleCopyClick(element, textToCopy) {
  await animateClick(element);
  
  if (navigator.clipboard) {
    navigator.clipboard.writeText(textToCopy)
      .then(() => animateSuccess(element))
      .catch(() => fallbackCopy(textToCopy, element));
  } else {
    fallbackCopy(textToCopy, element);
  }
}

// 4. Логіка копіювання (для сумісності)
function fallbackCopy(text, element) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    animateSuccess(element);
  } catch (e) {}
  document.body.removeChild(ta);
}

// 5. Візуалізація успіху (включає тост)
function animateSuccess(el) {
  if (!el) return;
  
  // 1. Зелена вспышка кнопки
  el.classList.add('copied');
  setTimeout(() => {
    el.classList.remove('copied');
  }, 250);

  // 2. Показ тост-уведомления
  const toast = document.getElementById('copy-toast');
  if (toast) {
    toast.classList.add('btn', 'clicked', 'show');
    
    // Скрываем тост через заданное время
    setTimeout(() => {
      toast.classList.remove('btn', 'clicked', 'show');
    }, TOAST_DISPLAY_DURATION);
  }
}
</script>

</body>
</html>
