<!DOCTYPE html>
<html>
<head>
<style>
  :root { --bg: linear-gradient(135deg, #1a0033, #c1272d, #ff9a9e); }
  
  body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
  
  .iphone-screen {
    position: relative;
    width: 800px;
    height: 600px;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .bg-content {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 120px;
    font-weight: 900;
    color: white;
    opacity: 0.4;
    letter-spacing: -5px;
    user-select: none;
  }

  /* Линза */
  .lens-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }

  .lens {
    position: absolute;
    border-radius: 50%;
    /* В Safari это создает эффект матового стекла */
    -webkit-backdrop-filter: blur(20px) brightness(1.2) contrast(1.1);
    backdrop-filter: blur(20px) brightness(1.2) contrast(1.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.2);
    /* Эффект увеличения контента под линзой */
    transform: scale(1.1); 
  }

  /* Анимация движения линз */
  .lens-1 {
    width: 250px;
    height: 250px;
    animation: move1 12s infinite alternate ease-in-out;
  }

  .lens-2 {
    width: 200px;
    height: 200px;
    animation: move2 9s infinite alternate ease-in-out;
  }

  @keyframes move1 {
    0% { transform: translate(100px, 100px) scale(1.1); }
    100% { transform: translate(450px, 250px) scale(1.2); }
  }

  @keyframes move2 {
    0% { transform: translate(500px, 350px) scale(1.2); }
    100% { transform: translate(150px, 50px) scale(1.1); }
  }

  /* Эффект свечения при наложении (screen) */
  .lenses-layer {
    position: absolute;
    width: 100%; height: 100%;
    mix-blend-mode: screen;
  }
</style>
</head>
<body>

<div class="iphone-screen">
  <div class="bg-content">IPHONE 16</div>

  <div class="lenses-layer">
    <div class="lens lens-1"></div>
    <div class="lens lens-2"></div>
  </div>
</div>

</body>
</html>
