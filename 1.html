<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Переказ коштів</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* ===== ФОН (КОНТРАСТНЫЙ И СТАЦИОНАРНЫЙ) ===== */
body {
  min-height: 100vh;
  padding: 40px 16px;
  color: #fff;

  background-image:
    url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

/* затемнение */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0, 80, 40, 0.45);
  z-index: -1;
}

/* ===== КОНТЕЙНЕР ===== */
.container {
  max-width: 420px;
  margin: auto;
}

/* ===== ТЕКСТ ===== */
h1 {
  text-align: center;
  font-size: 26px;
  margin-bottom: 6px;
}

.small {
  text-align: center;
  opacity: .8;
  margin-bottom: 24px;
}

/* ===== НАСТОЯЩЕЕ LIQUID GLASS ===== */
.section {
  margin-bottom: 18px;
  padding: 16px;
  border-radius: 20px;

  background: rgba(255,255,255,0.18);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  /* КЛЮЧ: SVG-ИСКАЖЕНИЕ */
  filter: url(#liquid);

  border: 1px solid rgba(255,255,255,0.35);

  box-shadow:
    0 20px 50px rgba(0,0,0,.35),
    inset 0 1px 10px rgba(255,255,255,.25);
}

/* ===== КНОПКИ ===== */
.btn {
  display: block;
  text-align: center;
  text-decoration: none;
  color: #fff;

  padding: 14px;
  margin-bottom: 10px;
  border-radius: 14px;

  background: rgba(255,255,255,0.22);
  border: 1px solid rgba(255,255,255,0.35);
}

.copy {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 14px;
  margin-top: 10px;
  border-radius: 14px;
  cursor: pointer;

  background: rgba(255,255,255,0.22);
  border: 1px solid rgba(255,255,255,0.35);
}
</style>
</head>

<body>

<!-- ===== SVG LIQUID FILTER ===== -->
<svg width="0" height="0">
  <filter id="liquid">
    <!-- ШУМ -->
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.015 0.03"
      numOctaves="2"
      seed="2"
      result="noise">
      <animate
        attributeName="baseFrequency"
        dur="12s"
        values="
          0.015 0.03;
          0.02 0.04;
          0.015 0.03"
        repeatCount="indefinite"/>
    </feTurbulence>

    <!-- ИСКАЖЕНИЕ -->
    <feDisplacementMap
      in="SourceGraphic"
      in2="noise"
      scale="18"
      xChannelSelector="R"
      yChannelSelector="G"/>
  </filter>
</svg>

<div class="container">

<h1>💳 Перевести кошти</h1>
<div class="small">Оберіть зручний спосіб</div>

<div class="section">
  <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK">monobank</a>
  <a class="btn" href="https://www.privat24.ua/send/id4xg">ПриватБанк</a>

  <div class="copy" onclick="copyText('4441114459954077')">
    <span>💳 4441 •••• •••• 4077</span>
    <span>📋</span>
  </div>
</div>

<div class="section">
  <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK"> Apple Pay</a>
  <a class="btn" href="https://send.monobank.ua/5a2bBZvgLK">Google Pay</a>
</div>

</div>

<script>
function copyText(text) {
  navigator.clipboard.writeText(text);
  navigator.vibrate?.(20);
  alert("Скопійовано:\n" + text);
}
</script>

</body>
</html>
