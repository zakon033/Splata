<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #000; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  
  .iphone-stage {
    position: relative;
    width: 800px; height: 600px;
    background: linear-gradient(135deg, #1a0033, #c1272d, #4a148c);
    display: flex; justify-content: center; align-items: center;
    /* Фильтр теперь ссылается на внешний SVG */
    filter: url(#lens-refraction);
  }

  .text {
    color: white; font-family: sans-serif; font-size: 110px; font-weight: 900;
    letter-spacing: -5px; pointer-events: none;
  }

  /* Мы не будем анимировать через SVG, мы будем двигать эти невидимые точки */
  .lens-tracker { position: absolute; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>

<div class="iphone-stage">
  <div class="text">IPHONE 16</div>
</div>

<svg width="0" height="0">
  <filter id="lens-refraction" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
    
    <feOffset dx="0" dy="0" result="movedNoise">
      <animate attributeName="dx" dur="5s" values="0; 100; 0" repeatCount="indefinite" />
      <animate attributeName="dy" dur="7s" values="0; 50; 0" repeatCount="indefinite" />
    </feOffset>

    <feDisplacementMap in="SourceGraphic" in2="movedNoise" scale="80" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

<script>
  // Этот микро-скрипт просто "дергает" Safari, чтобы он не засыпал
  const stage = document.querySelector('.iphone-stage');
  function pokeSafari() {
    // Минимальное изменение стиля заставляет WebKit перерисовать фильтр
    stage.style.opacity = stage.style.opacity === "0.999" ? "1" : "0.999";
    requestAnimationFrame(pokeSafari);
  }
  pokeSafari();
</script>

</body>
</html>
