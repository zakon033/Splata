<title>Переказ коштів - Liquid Glass PRO</title>

<style>
/* 1. ФОН (ОБОВ'ЯЗКОВО ДЛЯ ЕФЕКТУ СКЛА) */
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  /* Для наочності "рідкого" скла використовуємо помітний фон */
  background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
  color: #fff;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 2. SVG ФІЛЬТР ДЛЯ "РІДКОГО" ЕФЕКТУ (Liquid Glass Displacement) */
/* Це код, що відповідає техніці, описаній у статті Habr. */
.bg-liquid-glass {
  /* Запасний варіант для браузерів без підтримки SVG-фільтра у backdrop-filter (наприклад, Safari) */
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

/* УВАГА: Використання displacement map у backdrop-filter підтримується не всіма браузерами.
   Цей блок CSS активує складний ефект лише там, де це можливо (Chrome, Firefox, Edge). */
@supports (backdrop-filter: url(#displacementFilter) blur(10px)) {
  .bg-liquid-glass {
    /* Додаємо SVG-фільтр прямо в backdrop-filter для "хвилястості" */
    backdrop-filter: url(#displacementFilter) blur(5px);
    -webkit-backdrop-filter: url(#displacementFilter) blur(5px);
    background: rgba(255, 255, 255, 0.08);
  }
}

.container {
  max-width: 400px;
  width: 100%;
  padding: 25px;
  border-radius: 18px; /* Більш плавні кути */
  /* Застосовуємо ефект скла до контейнера */
  background: rgba(255, 255, 255, 0.05);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
}

h1 {
  color: #e6f7ff; 
  text-align: center;
  margin-bottom: 5px;
  text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
}
.small {
  text-align: center;
  color: #b3cde6;
  margin-bottom: 20px;
  font-size: 0.9em;
}

.section {
  margin-bottom: 25px;
  padding: 15px;
  margin-top: 15px; 
  border-radius: 12px;
  /* Застосовуємо ефект скла до секцій */
  background: rgba(255, 255, 255, 0.05); /* Додаткова прозорість для шаруватості */
  border: 1px solid rgba(255, 255, 255, 0.1);
}

/* 3. Стилізація кнопок та копіювання (для кращого контрасту) */
.btn {
  display: block;
  text-decoration: none;
  background-color: rgba(255, 255, 255, 0.9); /* Майже непрозорий білий */
  color: #182848;
  padding: 12px 15px;
  margin: 10px 0;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
  border: none;
}

/* ЕФЕКТ КНОПКИ: М'яке натискання */
.btn:hover, .btn:focus {
  background-color: #fff;
  transform: scale(1.02);
  box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
}

/* Стилізація секцій для копіювання */
.copy {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: rgba(255, 255, 255, 0.15); 
  color: #fff;
  padding: 12px 15px;
  margin: 10px 0;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid rgba(255, 255, 255, 0.2);
  transition: background-color 0.2s;
}

/* ЕФЕКТ КОПІЮВАННЯ: Легке підсвічування при наведенні */
.copy:hover {
  background-color: rgba(255, 255, 255, 0.3);
}

.copy span:last-child {
  font-size: 1.2em;
  margin-left: 10px;
}
</style>
</head>
