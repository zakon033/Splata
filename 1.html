<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  .iphone-event {
    position: relative;
    width: 800px; height: 600px;
    background: linear-gradient(135deg, #1a0033 0%, #c1272d 50%, #4a148c 100%);
    display: flex; justify-content: center; align-items: center;
    /* Применяем фильтр к живому тексту */
    filter: url(#iphone16-lens);
  }
  .text {
    color: white; font-family: -apple-system, sans-serif; font-size: 110px; font-weight: 900;
    letter-spacing: -5px; user-select: none;
  }
</style>
</head>
<body>

<div class="iphone-event">
  <div class="text">IPHONE 16</div>
</div>

<svg width="0" height="0">
  <defs>
    <filter id="iphone16-lens" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />

      <feImage result="lensMap" width="800" height="600" xlink:href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='800' height='600'%3E%3Ccircle r='120' fill='white'%3E%3CanimateMotion dur='8s' repeatCount='indefinite' path='M200,300 Q400,100 600,300 T200,300' /%3E%3C/circle%3E%3Ccircle r='100' fill='white'%3E%3CanimateMotion dur='6s' repeatCount='indefinite' path='M600,300 Q400,500 200,300 T600,300' /%3E%3C/circle%3E%3C/svg%3E" />

      <feComposite in="noise" in2="lensMap" operator="in" result="finalMap" />

      <feDisplacementMap in="SourceGraphic" in2="finalMap" scale="120" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

</body>
</html>
