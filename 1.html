<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  
  .canvas {
    position: relative;
    width: 800px;
    height: 500px;
    background: linear-gradient(135deg, #1a0033, #c1272d, #4a148c);
    display: flex;
    justify-content: center;
    align-items: center;
    /* ГЛАВНЫЙ СЕКРЕТ: применяем фильтр прямо к контейнеру */
    filter: url(#iphone-lens-warp);
  }

  .text {
    color: white;
    font-family: -apple-system, sans-serif;
    font-size: 100px;
    font-weight: 900;
    letter-spacing: -5px;
    text-shadow: 0 0 20px rgba(255,255,255,0.2);
  }

  /* Визуальные блики линз (просто для красоты, искажение делает фильтр) */
  .glare {
    position: absolute;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  
  .g1 { animation: move1 10s infinite alternate ease-in-out; }
  .g2 { animation: move2 7s infinite alternate ease-in-out; }

  @keyframes move1 { from { left: 10%; top: 10%; } to { left: 60%; top: 40%; } }
  @keyframes move2 { from { left: 70%; top: 50%; } to { left: 20%; top: 10%; } }
</style>
</head>
<body>

<div class="canvas">
  <div class="text">IPHONE 16</div>
  <div class="glare g1"></div>
  <div class="glare g2"></div>
</div>

<svg width="0" height="0">
  <filter id="iphone-lens-warp" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise">
      <animate attributeName="baseFrequency" dur="15s" values="0.015; 0.02; 0.015" repeatCount="indefinite" />
    </feTurbulence>
    
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="80" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

</body>
</html>
