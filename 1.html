<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #000; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  
  .container {
    position: relative;
    width: 800px; height: 600px;
    background: linear-gradient(135deg, #1a0033, #c1272d, #4a148c);
    display: flex; justify-content: center; align-items: center;
    user-select: none;
  }

  /* Общий стиль для текста */
  .text-base {
    font-family: -apple-system, sans-serif;
    font-size: 120px;
    font-weight: 900;
    letter-spacing: -5px;
    white-space: nowrap;
  }

  /* Слой 1: Фоновый текст (тусклый) */
  .bg-layer {
    color: white;
    opacity: 0.3;
  }

  /* Слой 2: Текст внутри линз (яркий и сдвинутый) */
  .lens-layer {
    position: absolute;
    width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;
    color: white;
    /* ГЛАВНОЕ: Сдвигаем текст в этом слое на 20px вправо и вверх */
    transform: translate(20px, -10px);
    /* Маскируем этот слой движущимися кругами */
    -webkit-clip-path: url(#lens-mask);
    clip-path: url(#lens-mask);
  }
</style>
</head>
<body>

<div class="container">
  <div class="text-base bg-layer">IPHONE 16</div>

  <div class="lens-layer">
    <div class="text-base">IPHONE 16</div>
  </div>
</div>

<svg width="0" height="0" style="position: absolute;">
  <defs>
    <clipPath id="lens-mask" clipPathUnits="objectBoundingBox">
      <circle cx="0.5" cy="0.5" r="0.18">
        <animateTransform attributeName="transform" type="translate" dur="8s" 
          values="-0.3,-0.1; 0.3,0.2; -0.3,-0.1" repeatCount="indefinite" />
      </circle>
      <circle cx="0.5" cy="0.5" r="0.14">
        <animateTransform attributeName="transform" type="translate" dur="6s" 
          values="0.3,0.1; -0.3,-0.2; 0.3,0.1" repeatCount="indefinite" />
      </circle>
    </clipPath>
  </defs>
</svg>

</body>
</html>
