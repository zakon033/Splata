<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Переказ коштів</title>

<style>
/* =========================
   1. БАЗОВЫЙ СБРОС
========================= */
* {
  box-sizing: border-box;
}

/* Максимально спрощуємо для кращої сумісності */
html, body {
  margin: 0;
  padding: 0;
  height: 100%; 
  min-height: 100vh; /* Використовуємо 100vh як підстраховку */
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  color: #ffffff;
  background-color: transparent; /* body не має фону */
  overflow-y: auto; /* body прокручується */
  /* Важливо: body має бути вище за фіксований фон */
  position: relative; 
  z-index: 1; 
}


/* =========================
   2. ФОН (ЖИДКОЕ СТЕКЛО) - ТЕПЕР ОКРЕМИЙ ЕЛЕМЕНТ
========================= */
.bg-fixed {
  position: fixed; /* ГАРАНТІЯ ФІКСАЦІЇ */
  top: 0;
  left: 0;
  width: 100%;
  height: 100%; /* Це має покрити весь вьюпорт */
  z-index: -1; /* Поміщаємо під вміст */

  background-color: #1b1f3b; /* fallback */
  background-image: url("./bg-liquid.webp"); 
  background-repeat: no-repeat;
  background-position: center;
  background-size: cover;
  
  /* ХАК iOS Safe Area (якщо потрібен) */
  min-height: 100vh;
}

/* =========================
   3. КОНТЕЙНЕР
========================= */
.container {
  max-width: 420px;
  width: 100%; 
  margin: 0 auto;
  padding: 24px 16px 40px;
}
