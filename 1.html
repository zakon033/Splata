<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #000; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  
  .iphone-stage {
    position: relative;
    width: 800px; height: 600px;
    background: linear-gradient(135deg, #1a0033, #c1272d, #4a148c);
    display: flex; justify-content: center; align-items: center;
    /* Применяем фильтр к сцене */
    filter: url(#lens-refraction);
  }

  .text {
    color: white; font-family: -apple-system, sans-serif; font-size: 110px; font-weight: 900;
    letter-spacing: -5px; user-select: none;
  }

  /* Мы будем двигать саму КАРТУ внутри фильтра */
</style>
</head>
<body>

<div class="iphone-stage">
  <div class="text">IPHONE 16</div>
</div>

<svg width="0" height="0" style="position: absolute;">
  <defs>
    <radialGradient id="sphereGrad">
      <stop offset="0%" stop-color="rgb(255,128,128)" />
      <stop offset="50%" stop-color="rgb(128,128,128)" />
      <stop offset="100%" stop-color="rgb(0,128,128)" />
    </radialGradient>

    <filter id="lens-refraction" x="-20%" y="-20%" width="140%" height="140%">
      <feImage result="lenses" width="800" height="600" xlink:href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='800' height='600'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0%25' stop-color='white'/%3E%3Cstop offset='100%25' stop-color='black'/%3E%3C/defs%3E%3Ccircle r='120' fill='url(%23g)'%3E%3CanimateMotion dur='6s' repeatCount='indefinite' path='M200,300 Q400,100 600,300 T200,300' /%3E%3C/circle%3E%3Ccircle r='100' fill='url(%23g)'%3E%3CanimateMotion dur='4s' repeatCount='indefinite' path='M600,300 Q400,500 200,300 T600,300' /%3E%3C/circle%3E%3C/svg%3E" />

      <feDisplacementMap in="SourceGraphic" in2="lenses" scale="100" xChannelSelector="R" yChannelSelector="R" />
      
      <feComposite in="SourceGraphic" in2="lenses" operator="arithmetic" k1="0" k2="1" k3="0.2" k4="0" />
    </filter>
  </defs>
</svg>

</body>
</html>
