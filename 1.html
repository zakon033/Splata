<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { cursor: crosshair; }
    </style>
</head>
<body>

<canvas id="lensCanvas"></canvas>

<script>
const canvas = document.getElementById('lensCanvas');
const ctx = canvas.getContext('2d');

const width = 800;
const height = 600;
canvas.width = width;
canvas.height = height;

// Создаем "картинку" фона (текст) в памяти
const bgCanvas = document.createElement('canvas');
bgCanvas.width = width;
bgCanvas.height = height;
const bgCtx = bgCanvas.getContext('2d');

function drawBackground() {
    const grad = bgCtx.createLinearGradient(0, 0, width, height);
    grad.addColorStop(0, '#2c003e');
    grad.addColorStop(0.5, '#c1272d');
    grad.addColorStop(1, '#4a148c');
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, width, height);
    
    bgCtx.fillStyle = 'rgba(255,255,255,0.4)';
    bgCtx.font = '900 120px sans-serif';
    bgCtx.textAlign = 'center';
    bgCtx.textBaseline = 'middle';
    bgCtx.fillText('IPHONE 16', width/2, height/2);
}

// Параметры линз
const lenses = [
    { x: 200, y: 300, r: 120, speedX: 2, speedY: 1.5 },
    { x: 600, y: 300, r: 100, speedX: -1.8, speedY: -2 }
];

function render() {
    // 1. Рисуем фон
    ctx.drawImage(bgCanvas, 0, 0);

    // 2. Для каждой линзы делаем преломление
    lenses.forEach(lens => {
        // Двигаем линзы
        lens.x += lens.speedX;
        lens.y += lens.speedY;
        if (lens.x < 100 || lens.x > width - 100) lens.speedX *= -1;
        if (lens.y < 100 || lens.y > height - 100) lens.speedY *= -1;

        const r = lens.r;
        const x = Math.floor(lens.x);
        const y = Math.floor(lens.y);

        // Математика преломления (сферическое искажение)
        // Мы берем кусок изображения и "растягиваем" его от центра
        for (let i = -r; i < r; i += 2) {
            for (let j = -r; j < r; j += 2) {
                const dist = Math.sqrt(i * i + j * j);
                if (dist < r) {
                    // Коэффициент преломления (чем ближе к центру, тем сильнее сдвиг)
                    const refraction = Math.pow(dist / r, 0.7); 
                    const sourceX = x + i * refraction;
                    const sourceY = y + j * refraction;

                    ctx.drawImage(bgCanvas, sourceX, sourceY, 2, 2, x + i, y + j, 2, 2);
                }
            }
        }
        
        // Рисуем легкий блик сверху
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.stroke();
    });

    requestAnimationFrame(render);
}

drawBackground();
render();
</script>

</body>
</html>
