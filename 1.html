<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Переказ коштів</title>

<style>
/* ===== СБРОС ===== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* ===== ФОН ===== */
body {
  min-height: 100vh;
  background:
    radial-gradient(1200px 600px at 10% 10%, rgba(0,255,140,.35), transparent 60%),
    radial-gradient(1000px 500px at 90% 30%, rgba(0,180,90,.35), transparent 60%),
    linear-gradient(180deg, #0a3f2a, #06281b);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 16px;
  color: #fff;
}

/* Лёгкий blur фона */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: -1;
}

/* ===== КОНТЕЙНЕР ===== */
.container {
  width: 100%;
  max-width: 420px;
}

/* ===== ЗАГОЛОВКИ ===== */
h1 {
  text-align: center;
  font-size: 26px;
  margin-bottom: 6px;
}

.small {
  text-align: center;
  opacity: .75;
  margin-bottom: 24px;
}

/* ===== LIQUID GLASS ===== */
.section {
  margin-bottom: 16px;
  padding: 16px;
  border-radius: 18px;

  background: rgba(255,255,255,0.12);
  backdrop-filter:
    blur(12px)
    saturate(180%);
  -webkit-backdrop-filter:
    blur(12px)
    saturate(180%);

  border: 1px solid rgba(255,255,255,0.22);

  box-shadow:
    0 10px 30px rgba(0,0,0,.35),
    inset 0 2px 8px rgba(255,255,255,.15);

  transition: transform .25s ease, box-shadow .25s ease;
}

.section:hover {
  transform: scale(1.015);
  box-shadow:
    0 14px 40px rgba(0,0,0,.45),
    inset 0 3px 10px rgba(255,255,255,.18);
}

/* ===== КНОПКИ ===== */
.btn {
  display: block;
  text-align: center;
  text-decoration: none;
  color: #fff;
  font-weight: 500;

  padding: 14px;
  margin-bottom: 10px;

  border-radius: 14px;
  background: rgba(255,255,255,0.16);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  border: 1px solid rgba(255,255,255,0.25);
  transition: background .2s ease, transform .2s ease;
}

.btn:last-child {
  margin-bottom: 0;
}

.btn:hover {
  background: rgba(255,255,255,0.25);
  transform: translateY(-1px);
}

/* ===== COPY BLOCK ===== */
.copy {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 14px;
  margin-top: 10px;

  border-radius: 14px;
  cursor: pointer;

  background: rgba(255,255,255,0.14);
  border: 1px solid rgba(255,255,255,0.25);

  transition: background .2s ease;
}

.copy:hover {
  background: rgba(255,255,255,0.22);
}

/* ===== МЕЛКИЙ ТЕКСТ ===== */
.copy span:last-child {
  opacity: .8;
}

/* ===== АДАПТИВ ===== */
@media (max-width: 360px) {
  h1 {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>💳 Перевести кошти</h1>

<div class="section">

<div class="section">

<script>
function copyText(text) {
  navigator.clipboard.writeText(text);
