<title>Переказ коштів</title>

<style>
/* Базовые стили для контейнера и секций */
.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

h1 {
  text-align: center;
  font-size: 2em;
  margin-bottom: 10px;
  color: #333;
}

.small {
  text-align: center;
  color: #666;
  margin-bottom: 30px;
  font-size: 1.1em;
}

/* Стили для секций с Liquid Glass */
.section {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

/* Кнопки с Liquid Glass */
.btn {
  display: block;
  width: 100%;
  padding: 15px;
  margin-bottom: 10px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 12px;
  color: #333;
  text-decoration: none;
  text-align: center;
  font-size: 1.1em;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.25);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
}

/* Элементы для копирования */
.copy {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  margin-bottom: 10px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  color: #333;
  font-size: 1em;
}

.copy:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: translateX(5px);
}

.copy span:last-child {
  font-size: 1.2em;
}

/* Liquid Glass для всего контейнера (опционально, для фона) */
.container {
  position: relative;
}

/* SVG для displacement map (Liquid Glass эффект) */
svg {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

.bg-liquid-glass {
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  background: rgba(255, 255, 255, 0.25);
}

@supports not (hanging-punctuation: first) {
  .bg-liquid-glass {
    backdrop-filter: url(#displacementFilter) blur(2px);
  }
}

/* Применяем Liquid Glass к секциям и кнопкам */
.section,
.btn,
.copy {
  position: relative;
}

/* Анимация для "жидкости" */
@keyframes liquid-wave {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(2px); }
}

.bg-liquid-glass:hover {
  animation: liquid-wave 2s ease-in-out infinite;
}
</style>
</head>
