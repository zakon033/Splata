<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Переказ коштів</title>

<style>
/* =========================
   1. БАЗОВЫЙ СБРОС
========================= */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%; 
}

/* =========================
   2. ФОН (ЖИДКОЕ СТЕКЛО)
========================= */
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  color: #ffffff;
  background-color: transparent;
  overflow-y: auto; 
}

/* ФІКС: ФІКСОВАНИЙ ФОН ЧЕРЕЗ PSEUDO-ELEMENT */
body::before {
  content: '';
  position: fixed; 
  inset: 0; 
  z-index: -1; 
  
  background-color: #1b1f3b; /* fallback */
  background-image: url("./bg-liquid.webp"); 
  background-repeat: no-repeat;
  background-position: center;
  background-size: cover;
}


/* =========================
   3. КОНТЕЙНЕР
========================= */
.container {
  max-width: 420px;
  width: 100%; 
  margin: 0 auto;
  /* !!! ФІНАЛЬНЕ ВИПРАВЛЕННЯ PADDING ДЛЯ iOS SAFE AREA (видаляє білі смуги) !!! */
  padding: 
    calc(24px + env(safe-area-inset-top, 0px)) 
    16px 
    calc(40px + env(safe-area-inset-bottom, 0px));
}

/* =========================
   4. ЗАГОЛОВКИ
========================= */
h1 {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 600;
}

.small {
  font-size: 14px;
  opacity: 0.75;
  margin-bottom: 18px;
}

/* =========================
   5. СЕКЦИИ
========================= */
.section {
  display: grid;
  gap: 12px;
  margin-bottom: 22px;
}

/* =========================
   6. СТЕКЛЯННЫЕ ЭЛЕМЕНТЫ
========================= */
.btn,
.copy {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 24px 18px; 
  border-radius: 48px; 

  /* ВАЖНО: фон есть всегда */
  background-color: rgba(255,255,255,0.18);

  /* Safari iOS */
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  backdrop-filter: blur(18px) saturate(170%);

  color: #ffffff;
  font-size: 16px;
  font-weight: 500;
  text-decoration: none;

  border: none;
  outline: none;

  box-shadow:
    0 10px 28px rgba(0,0,0,0.25),
    inset 0 1px 1px rgba(255,255,255,0.35);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

/* =========================
   7. МАСКА (НЕРОВНЫЙ КРАЙ)
   ФАЙЛ: ./mask/glass-edge.webp
   ⚠️ ТОЛЬКИ якщо підтримується
========================= */
@supports (-webkit-mask-image: url("")) {
  .btn,
  .copy {
    -webkit-mask-image: url("./mask/glass-edge.webp");
    -webkit-mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
  }
}

/* =========================
   8. ПОДСВЕТКА КРАЯ
========================= */
.btn::after,
.copy::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;

  background:
    radial-gradient(
      at 30% 20%,
      rgba(255,255,255,0.45),
      transparent 60%
    );

  mix-blend-mode: overlay;
  opacity: 0.6;
}

/* =========================
   9. НАЖАТИЕ (iOS)
========================= */
.btn:active,
.copy:active {
  transform: scale(0.97);
  box-shadow:
    0 6px 16px rgba(0,0,0,0.3),
    inset 0 1px 2px rgba(255,255,255,0.25);
}

/* =========================
   10. COPY
========================= */
.copy {
  cursor: pointer;
}
</style>
</head>

<body>

<h1>💳 Перевести кошти</h1>
