<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Переказ коштів</title>

<meta name="theme-color" content="#1b1f3b"> 
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
<meta name="apple-mobile-web-app-capable" content="yes"> 


<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; 
}

html { background-color: #1b1f3b; }

body {
  margin: 0; padding: 0; width: 100%; min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
  color: #ffffff; background: transparent !important; position: relative;
}

#background-image-wrap {
    position: fixed;
    /* Возвращаем строго по размеру экрана */
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    
    z-index: -1;
    background-image: url("./bg-liquid.webp");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    
    /* Убираем fixed отсюда, так как блок и так fixed. 
       Это предотвратит "прыжки" при скрытии адресной строки */
    background-attachment: scroll; 

    /* Игнорируем касания фона */
    pointer-events: none; 

    /* Фиксируем слой в памяти */
    transform: translateZ(0);
    -webkit-transform: translateZ(0);

    /* Возвращаем маску строго на место */
    mask-image: linear-gradient(to bottom, transparent 0%, black 80px, black calc(100% - 80px), transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 80px, black calc(100% - 80px), transparent 100%);
}



.container {
  max-width: 420px; width: 100%; margin: 0 auto; position: relative;
  z-index: 10; padding: calc(60px + env(safe-area-inset-top)) 20px calc(60px + env(safe-area-inset-bottom)); 
  text-align: center;
}

h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.subtitle { font-size: 22px; opacity: 0.9; margin-bottom: 30px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

/* =========================
   ОБЩИЙ СТИЛЬ КНОПОК
========================= */
.btn {
  position: relative;
  overflow: hidden; 
  display: flex;
  align-items: center; 
  width: 100%;
  height: 80px; 
  padding: 0 12px; 
  margin-bottom: 15px; 
  backdrop-filter: blur(15px); 
  -webkit-backdrop-filter: blur(15px);
  background-color: rgba(255, 255, 255, 0.1); 
  border: 1px solid rgba(255, 255, 255, 0.1); 
  border-radius: 70px; 
  color: #fff;
  text-decoration: none;
  font-size: 22px; 
  font-weight: 500;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  transition: transform 0.1s, background-color 0.2s; 
  cursor: pointer;
  user-select: none;

  /* Базовая анимация появления */
  opacity: 0;
  animation: fadeInUp 0.5s ease-out forwards;
}

.btn.clicked { 
    transform: scale(0.97) !important; 
    background-color: rgba(46, 204, 113, 0.3) !important; 
}
.btn.copied { background-color: rgba(46, 204, 113, 0.3) !important; }

.btn::before, .btn::after {
    content: ''; position: absolute; left: 0; width: 100%; height: 1.5px; z-index: 1;
}
.btn::before { top: 0; background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent); }
.btn::after { bottom: 0; background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent); }

.btn img { display: block; }

/* ТИПЫ КНОПОК */
.btn-full-logo { justify-content: center; }
.btn-full-logo img { height: 38px; width: auto; max-width: 80%; object-fit: contain; }

/* Уменьшаем логотипы Pay в 1.3 раза (38px / 1.3 ≈ 29px) */
.btn-pay-small img {
    height: 28px !important;
}


.btn-with-text { justify-content: flex-start; }

.btn-icon, .btn-icon-right {
    width: 54px; height: 100%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding-top: 2px; 
}
.btn-icon { margin-right: 12px; }
.btn-icon-right { margin-left: 12px; }
.btn-icon img, .btn-icon-right img { width: 100%; height: auto; max-height: 54px; object-fit: contain; }

.btn-text {
    white-space: nowrap; height: 100%; display: flex; align-items: center; line-height: 1; padding-top: 2px; flex-grow: 1;
}

.btn-card { justify-content: center; }
.card-number-font {
    font-family: 'Consolas', 'Courier New', monospace;
    /* Адаптивный размер: минимум 16px, оптимум 6vw, максимум 26px */
    font-size: clamp(16px, 6vw, 26px); 
    font-weight: 500;
    letter-spacing: 1px;
    color: #e0e0e0; 
    text-shadow: 
        -2px -2px 3px rgba(255, 255, 255, 0.4), 
         2px 2px 3px rgba(0, 0, 0, 0.9);
    height: 100%;
    display: flex;
    align-items: center;
    line-height: 1;
    white-space: nowrap; /* Строгий запрет переноса на вторую строку */
    overflow: hidden;    /* Защита от вылета текста за края */
}


.btn-triple { justify-content: space-between; }
.btn-triple .btn-text { justify-content: left; }

/* =========================
   ВОССТАНОВЛЕННЫЙ ТОЧНЫЙ TOAST
========================= */
#copy-toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, calc(-50% - 150px)); 
    padding: 18px 36px;           
    border-radius: 70px;          
    background-color: rgba(255, 255, 255, 0.1); 
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden; 
    font-size: 22px; font-weight: 600; color: #ffffff; 
    z-index: 1000; opacity: 0; pointer-events: none;
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease-out, background-color 0.2s;
}

#copy-toast::before, #copy-toast::after {
    content: ''; position: absolute; left: 0; width: 100%; height: 2px; z-index: 1;
}
#copy-toast::before { top: 0; background: linear-gradient(to right, rgba(46, 204, 113, 0), rgba(46, 204, 113, 0.8), rgba(46, 204, 113, 0)); }
#copy-toast::after { bottom: 0; background: linear-gradient(to right, rgba(46, 204, 113, 0), rgba(46, 204, 113, 0.5), rgba(46, 204, 113, 0)); }

#copy-toast.show {
    opacity: 1;
    transform: translate(-50%, -50%);
    background-color: rgba(46, 204, 113, 0.25);
    box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
}

/* =========================
   ИСПРАВЛЕННАЯ АНИМАЦИЯ
========================= */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; }
}

.btn:nth-child(3) { animation-delay: 0.1s; }
.btn:nth-child(4) { animation-delay: 0.2s; }
.btn:nth-child(5) { animation-delay: 0.3s; }
.btn:nth-child(6) { animation-delay: 0.4s; }
.btn:nth-child(7) { animation-delay: 0.5s; }
.btn:nth-child(8) { animation-delay: 0.6s; }
.btn:nth-child(9) { animation-delay: 0.7s; }
.btn:nth-child(10) { animation-delay: 0.8s; }
.btn:nth-child(11) { animation-delay: 0.9s; }
.btn:nth-child(12) { animation-delay: 1.0s; }
.btn:nth-child(13) { animation-delay: 1.1s; }
.btn:nth-child(14) { animation-delay: 1.2s; }
</style>


</head>

<body>

<div id="background-image-wrap"></div>

<div class="container">
  <h1>💳 Переказати кошти</h1>
  <div class="subtitle">Оберіть зручний спосіб</div>

  <a class="btn btn-full-logo" data-href="https://send.monobank.ua/5a2bBZvgLK" onclick="handleLinkClick(this)">
    <img src="img/monobank.svg" alt="monobank">
  </a>

  <a class="btn btn-full-logo" data-href="https://www.privat24.ua/send/id4xg" onclick="handleLinkClick(this)">
    <img src="img/PrivatBank.svg" alt="PrivatBank">
  </a>

  <div class="btn btn-card" onclick="handleCopyClick(this, '4441114459954077')">
    <span class="card-number-font">4441 •••• •••• 4077</span>
  </div>
  
  <a class="btn btn-full-logo btn-pay-small" data-href="https://send.monobank.ua/5a2bBZvgLK" onclick="handleLinkClick(this)">
     <img src="img/apple_pay.svg" alt="apple_pay">
  </a>

  <a class="btn btn-full-logo btn-pay-small" data-href="https://send.monobank.ua/5a2bBZvgLK" onclick="handleLinkClick(this)">
    <img src="img/google_pay.svg" alt="google_pay">
  </a>
  
  <a class="btn btn-with-text" data-href="https://app.binance.com/uni-qr/LXViL5Hb" onclick="handleLinkClick(this)">
    <div class="btn-icon"><img src="img/bnb.svg" alt="binance"></div>
    <span class="btn-text">Binance Pay</span>
  </a>

  <div class="btn btn-with-text" onclick="handleCopyClick(this, 'bc1qktmy8wcu3uvyugx3fgttg4t00akuvdk24anxcp')">
    <div class="btn-icon"><img src="img/btc.svg" alt="btc"></div>
    <span class="btn-text">Bitcoin (BTC)</span>
  </div>
  
  <div class="btn btn-with-text" onclick="handleCopyClick(this, '0xCcbD44EA963812ECc7F592a608245284c5cD87D9')">
    <div class="btn-icon"><img src="img/eth.svg" alt="eth"></div>
    <span class="btn-text">Ethereum (ETH)</span>
  </div>
  
  <div class="btn btn-with-text" onclick="handleCopyClick(this, 'TKobQmn3adNdXZ9aLfLhUe9bWF2pA9PhPh')">
    <div class="btn-icon"><img src="img/usdt.svg" alt="usdt"></div>
    <span class="btn-text">USDT (Tether)</span>
  </div>
  
  <div class="btn btn-with-text" onclick="handleCopyClick(this, 'EfwLdkavt2q59LfFnRjpVXQ9TpQiMpMnmJjbXUYLxps7')">
    <div class="btn-icon"><img src="img/sol.svg" alt="sol"></div>
    <span class="btn-text">Solana (SOL)</span>
  </div>
  
  <div class="btn btn-with-text" onclick="handleCopyClick(this, '0xCcbD44EA963812ECc7F592a608245284c5cD87D9')">
    <div class="btn-icon"><img src="img/usdc.svg" alt="usdc"></div>
    <span class="btn-text">USDC (Polygon)</span>
  </div>

  <a class="btn btn-triple" data-href="https://link.trustwallet.com/send?address=0xCcbD44EA963812ECc7F592a608245284c5cD87D9&asset=c966_t0x576Cf361711cd940CD9C397BB98C4C896cBd38De" target="_blank" onclick="handleLinkClick(this)">
     <div class="btn-icon"><img src="img/usdc.svg" alt="usdc"></div> 
     <span class="btn-text">USDC (Polygon)</span>
     <div class="btn-icon-right"><img src="img/trust.svg" alt="trust"></div> 
  </a>
</div>

<div id="copy-toast">Скопійовано!</div>

<script>
const CLICK_ANIMATION_DURATION = 150; 
const TOAST_DISPLAY_DURATION = 2000; 

function animateClick(element) {
  return new Promise(resolve => {
    element.classList.add('clicked');
    setTimeout(() => {
      element.classList.remove('clicked');
      resolve();
    }, CLICK_ANIMATION_DURATION);
  });
}

async function handleLinkClick(element) {
  event.preventDefault(); 
  const targetURL = element.getAttribute('data-href');
  if (!targetURL) return;
  await animateClick(element); 
  window.location.href = targetURL;
}

async function handleCopyClick(element, textToCopy) {
  await animateClick(element);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(textToCopy)
      .then(() => animateSuccess(element))
      .catch(() => fallbackCopy(textToCopy, element));
  } else {
    fallbackCopy(textToCopy, element);
  }
}

function animateSuccess(el) {
  if (!el) return;
  el.classList.add('copied');
  setTimeout(() => el.classList.remove('copied'), 250);
  
  const toast = document.getElementById('copy-toast');
  if (toast) {
    toast.classList.add('show'); 
    setTimeout(() => toast.classList.remove('show'), TOAST_DISPLAY_DURATION);
  }
}

function fallbackCopy(text, element) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  animateSuccess(element);
}
</script>

</body>
</html>
