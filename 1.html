<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Переказ коштів</title>

<style>
/* ===== Общий фон (liquid glass background) ===== */
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  background: url("/bg-liquid.webp") center / cover no-repeat fixed;
  color: #fff;
}

/* ===== Контейнер ===== */
.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

h1 {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 600;
}

.small {
  opacity: 0.75;
  font-size: 14px;
  margin-bottom: 18px;
}

/* ===== Секции ===== */
.section {
  display: grid;
  gap: 12px;
  margin-bottom: 22px;
}

/* ===== Стеклянная кнопка ===== */
.btn,
.copy {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 14px 18px;
  border-radius: 18px;

  background: rgba(255,255,255,0.18);

  -webkit-backdrop-filter: blur(18px) saturate(170%);
  backdrop-filter: blur(18px) saturate(170%);

  -webkit-mask-image: url("/mask/glass-edge.webp");
  -webkit-mask-size: 100% 100%;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;

  color: #fff;
  text-decoration: none;
  font-size: 16px;
  font-weight: 500;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.25),
    inset 0 1px 1px rgba(255,255,255,0.35);

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    background .15s ease;
}

/* ===== Подсветка неровного края ===== */
.btn::after,
.copy::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;

  background:
    radial-gradient(
      at 30% 20%,
      rgba(255,255,255,0.45),
      transparent 60%
    );

  mix-blend-mode: overlay;
  opacity: 0.6;
}

/* ===== Активное нажатие (iOS-style) ===== */
.btn:active,
.copy:active {
  transform: scale(0.97);
  box-shadow:
    0 6px 18px rgba(0,0,0,0.3),
    inset 0 1px 2px rgba(255,255,255,0.25);
}

/* ===== Copy-блок ===== */
.copy {
  cursor: pointer;
}

/* ===== Мелкие улучшения ===== */
.section:last-child {
  margin-bottom: 0;
}
</style>
</head>

<body>
<div class="container">

<h1>💳 Перевести кошти</h1>
<div class="small">Оберіть зручний спосіб</div>

<div class="section">

  <div class="copy" onclick="copyText('4441114459954077')">

</div>

<div class="section">

  <div class="copy" onclick="copyText('EfwLdkavt2q59LfFnRjpVXQ9TpQiMpMnmJjbXUYLxps7')">

</html>
