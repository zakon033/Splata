<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
  
  .container { position: relative; width: 800px; height: 600px; background: linear-gradient(45deg, #2c003e, #c1272d, #ee9ca7); overflow: hidden; }

  /* Текст на фоне */
  .bg-text { position: absolute; width: 100%; top: 50%; transform: translateY(-50%); color: white; font-family: sans-serif; font-size: 100px; font-weight: 900; text-align: center; opacity: 0.3; pointer-events: none; }

  /* Линзы */
  .lens {
    position: absolute;
    border-radius: 50%;
    /* ГЛАВНОЕ: Этот фильтр работает в Safari именно с фоном */
    backdrop-filter: url(#distort);
    -webkit-backdrop-filter: url(#distort);
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
  }

  .lens-1 { width: 250px; height: 250px; animation: move1 10s infinite alternate ease-in-out; }
  .lens-2 { width: 200px; height: 200px; animation: move2 8s infinite alternate ease-in-out; }

  @keyframes move1 { from { left: 10%; top: 10%; } to { left: 60%; top: 50%; } }
  @keyframes move2 { from { left: 70%; top: 60%; } to { left: 20%; top: 20%; } }
</style>
</head>
<body>

<div class="container">
  <div class="bg-text">IPHONE 16</div>
  
  <div class="lens lens-1"></div>
  <div class="lens lens-2"></div>
</div>

<svg width="0" height="0" style="position:absolute;">
  <defs>
    <filter id="distort">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" />
    </filter>
  </defs>
</svg>

</body>
</html>
