<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="background: #000;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#300050" />
      <stop offset="50%" stop-color="#c1272d" />
      <stop offset="100%" stop-color="#ff9a9e" />
    </linearGradient>

    <filter id="lensFilter" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="600">
      <feImage href="#lenses" result="mapLayer"/>
      
      <feDisplacementMap in="SourceGraphic" in2="mapLayer" scale="100" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g id="lenses" style="display: none;">
    <rect width="800" height="600" fill="#808080" /> <circle r="120" fill="white">
      <animateMotion dur="6s" repeatCount="indefinite" path="M200,300 Q400,100 600,300 T200,300" />
    </circle>
    <circle r="100" fill="white">
      <animateMotion dur="4s" repeatCount="indefinite" path="M600,300 Q400,500 200,300 T600,300" />
    </circle>
  </g>

  <g filter="url(#lensFilter)">
    <rect width="100%" height="100%" fill="url(#bgGrad)" />
    
    <g stroke="white" stroke-width="1" opacity="0.3">
        <path d="M0,100 H800 M0,200 H800 M0,300 H800 M0,400 H800 M0,500 H800" />
        <path d="M100,0 V600 M200,0 V600 M300,0 V600 M400,0 V600 M500,0 V600 M600,0 V600 M700,0 V600" />
    </g>
    <text x="50%" y="55%" font-family="sans-serif" font-weight="900" font-size="100" fill="white" text-anchor="middle" letter-spacing="-5">IPHONE 16</text>
  </g>

  <g style="mix-blend-mode: screen; pointer-events: none;">
    <circle r="120" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M200,300 Q400,100 600,300 T200,300" />
    </circle>
    <circle r="100" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)">
      <animateMotion dur="4s" repeatCount="indefinite" path="M600,300 Q400,500 200,300 T600,300" />
    </circle>
  </g>
</svg>
