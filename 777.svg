<svg width="450" height="1000" viewBox="0 0 450 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="450" height="1000" fill="black"/>
  
  <defs>
    <radialGradient id="topSphere" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(225 100) rotate(90) scale(400)">
      <stop offset="0" stop-color="#A5A7C5" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#1D1E2C"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>

    <radialGradient id="middleSphereBase" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 550) rotate(90) scale(450)">
      <stop offset="0.7" stop-color="#0E1117"/>
      <stop offset="1" stop-color="#05070A"/>
    </radialGradient>
    
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 550) rotate(180) scale(400)">
      <stop offset="0" stop-color="#3A86FF" stop-opacity="0.8"/>
      <stop offset="0.2" stop-color="#3A86FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="200" cy="550" r="400" fill="url(#middleSphereBase)"/>
  <circle cx="200" cy="550" r="400" stroke="url(#blueGlow)" stroke-width="3" style="mix-blend-mode: screen;"/>

  <ellipse cx="350" cy="50" rx="350" ry="300" fill="url(#topSphere)"/>
  
  <g opacity="0.9">
    <ellipse cx="500" cy="850" rx="350" ry="350" fill="#0A1931"/>
    <ellipse cx="480" cy="830" rx="300" ry="300" stroke="#4CC9FE" stroke-width="2" fill="none" opacity="0.6"/>
    <ellipse cx="490" cy="840" rx="310" ry="310" stroke="#4CC9FE" stroke-width="1" fill="none" opacity="0.4"/>
  </g>
</svg>
