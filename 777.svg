<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 2000"
  width="1000"
  height="2000">

  <defs>

    <!-- Тёмно-серый объём -->
    <radialGradient id="gDark"
      cx="45%" cy="35%" r="65%"
      fx="40%" fy="30%">
      <stop offset="0%" stop-color="#3f3c46" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#1b1c22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="1"/>
    </radialGradient>

    <!-- Светлый серый верх -->
    <radialGradient id="gLight"
      cx="40%" cy="40%" r="70%"
      fx="35%" fy="35%">
      <stop offset="0%" stop-color="#6b6672" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#2a2930" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#14151a" stop-opacity="1"/>
    </radialGradient>

    <!-- Синий акцент -->
    <radialGradient id="gBlue"
      cx="50%" cy="50%" r="65%"
      fx="55%" fy="45%">
      <stop offset="0%" stop-color="#2a4fff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#0b1b55" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#05070f" stop-opacity="1"/>
    </radialGradient>

  </defs>

  <!-- Верхний круг -->
  <circle
    cx="700"
    cy="200"
    r="600"
    fill="url(#gLight)" />

  <!-- Центральный тёмный круг -->
  <circle
    cx="300"
    cy="900"
    r="750"
    fill="url(#gDark)" />

  <!-- Нижний синий круг -->
  <circle
    cx="650"
    cy="1600"
    r="550"
    fill="url(#gBlue)" />

</svg>