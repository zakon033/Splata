<svg width="450" height="1000" viewBox="0 0 450 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#000000"/>
  
  <defs>
    <radialGradient id="topSphereGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="70%">
      <stop offset="0%" stop-color="#B8BAd4" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#242538" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="centerBodyGrad" cx="50%" cy="50%" r="50%" fx="20%" fy="50%">
      <stop offset="0%" stop-color="#1C1E29"/>
      <stop offset="100%" stop-color="#030405"/>
    </radialGradient>

    <radialGradient id="centerRimGrad" cx="50%" cy="50%" r="50%" fx="95%" fy="50%">
      <stop offset="0%" stop-color="#4C8DFF" stop-opacity="0.8"/>
      <stop offset="15%" stop-color="#3A60A0" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bottomBackGrad" cx="50%" cy="50%" r="50%">
       <stop offset="0%" stop-color="#0D264D"/>
       <stop offset="100%" stop-color="#020814"/>
    </radialGradient>

    <radialGradient id="bottomFrontGrad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#65E0FF" stop-opacity="0.85"/> <stop offset="50%" stop-color="#1E5BB5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#051530" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="520" r="480" fill="url(#centerBodyGrad)"/>
  <circle cx="100" cy="520" r="480" fill="url(#centerRimGrad)"/>

  <ellipse cx="480" cy="20" rx="420" ry="380" fill="url(#topSphereGrad)" transform="rotate(15 480 20)"/>

  <circle cx="500" cy="880" r="350" fill="url(#bottomBackGrad)" opacity="0.8"/>

  <g transform="rotate(-25 400 920)">
      <ellipse cx="400" cy="920" rx="360" ry="300" fill="url(#bottomFrontGrad)"/>
      
      <ellipse cx="395" cy="915" rx="350" ry="290" fill="none" stroke="#A3F3FF" stroke-width="2" opacity="0.9"/>
      <ellipse cx="390" cy="910" rx="355" ry="295" fill="none" stroke="#5AA5FF" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>
