<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 2000"
  width="1000"
  height="2000">

  <defs>

    <!-- ФОН -->
    <radialGradient id="bg"
      cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#1a1d2a"/>
      <stop offset="60%" stop-color="#0b0e16"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>

    <!-- ОБЪЁМ: тёмный -->
    <radialGradient id="darkBody"
      cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3b3942" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#15161d"/>
      <stop offset="100%" stop-color="#07080d"/>
    </radialGradient>

    <!-- СВЕЧЕНИЕ: мягкий свет -->
    <radialGradient id="edgeGlowSoft"
      cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="85%" stop-color="#cfd0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#aeb0ff" stop-opacity="0.45"/>
    </radialGradient>

    <!-- ОБЪЁМ: синий -->
    <radialGradient id="blueBody"
      cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1b2fff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#0b1440" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>

    <!-- СВЕЧЕНИЕ: синее -->
    <radialGradient id="edgeGlowBlue"
      cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#3a5bff" stop-opacity="0"/>
      <stop offset="85%" stop-color="#3a6bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4a7cff" stop-opacity="0.6"/>
    </radialGradient>

  </defs>

  <!-- ФОН -->
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- ВЕРХНИЙ КРУГ -->
  <circle cx="700" cy="200" r="610" fill="url(#edgeGlowSoft)"/>
  <circle cx="700" cy="200" r="580" fill="url(#darkBody)"/>

  <!-- ЦЕНТРАЛЬНЫЙ КРУГ -->
  <circle cx="300" cy="900" r="770" fill="url(#edgeGlowSoft)"/>
  <circle cx="300" cy="900" r="740" fill="url(#darkBody)"/>

  <!-- НИЖНИЙ СИНИЙ КРУГ -->
  <circle cx="650" cy="1600" r="570" fill="url(#edgeGlowBlue)"/>
  <circle cx="650" cy="1600" r="540" fill="url(#blueBody)"/>

</svg>