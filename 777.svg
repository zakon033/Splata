
<svg width="450" height="1000" viewBox="0 0 450 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="450" height="1000" fill="black"/>
  
  <defs>
    <radialGradient id="gradTop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 100) rotate(110) scale(400)">
      <stop offset="0" stop-color="#C0C2D3" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#1A1B26"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>

    <radialGradient id="gradMiddle" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 500) rotate(90) scale(500)">
      <stop offset="0.8" stop-color="#0B0D11"/>
      <stop offset="1" stop-color="#05070A"/>
    </radialGradient>

    <radialGradient id="edgeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(420 500) rotate(180) scale(350)">
      <stop offset="0" stop-color="#3A86FF" stop-opacity="0.6"/>
      <stop offset="0.3" stop-color="#3A86FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gradFront" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 850) rotate(220) scale(400)">
      <stop offset="0" stop-color="#4CC9FE" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#0A2472"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="550" r="450" fill="url(#gradMiddle)"/>
  <circle cx="100" cy="550" r="450" stroke="url(#edgeGlow)" stroke-width="2" style="mix-blend-mode: screen;"/>

  <ellipse cx="400" cy="50" rx="400" ry="350" fill="url(#gradTop)"/>
  
  <circle cx="550" cy="850" r="350" fill="#051020"/>

  <g style="mix-blend-mode: screen;">
    <ellipse cx="450" cy="900" rx="380" ry="320" fill="url(#gradFront)" opacity="0.8"/>
    <ellipse cx="445" cy="895" rx="340" ry="280" stroke="#7ADCFF" stroke-width="3" fill="none" opacity="0.7"/>
    <ellipse cx="435" cy="885" rx="335" ry="275" stroke="#7ADCFF" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>
</svg>
