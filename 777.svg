<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 2000"
     width="1000"
     height="2000">

<defs>

  <!-- ФОН -->
  <radialGradient id="bg"
    cx="50%" cy="28%" r="95%">
    <stop offset="0%"   stop-color="#1e2232"/>
    <stop offset="55%"  stop-color="#0c0f1a"/>
    <stop offset="100%" stop-color="#05070d"/>
  </radialGradient>

  <!-- ТЕЛО (тёмное стекло) -->
  <radialGradient id="bodyDark"
    cx="42%" cy="34%" r="70%"
    fx="38%" fy="30%">
    <stop offset="0%"  stop-color="#4b4656" stop-opacity="0.96"/>
    <stop offset="50%" stop-color="#1c1d26" stop-opacity="0.96"/>
    <stop offset="100%" stop-color="#07080d" stop-opacity="1"/>
  </radialGradient>

  <!-- ТЕЛО (синее стекло) -->
  <radialGradient id="bodyBlue"
    cx="50%" cy="45%" r="70%"
    fx="54%" fy="42%">
    <stop offset="0%"  stop-color="#3352ff" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#0d1b55" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#050710" stop-opacity="1"/>
  </radialGradient>

  <!-- ПЛАВНОЕ СВЕЧЕНИЕ (универсальное) -->
  <radialGradient id="glowSmooth"
    cx="50%" cy="50%" r="52%">
    <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="72%" stop-color="#d6d9ff" stop-opacity="0.10"/>
    <stop offset="82%" stop-color="#c6cbff" stop-opacity="0.22"/>
    <stop offset="90%" stop-color="#dfe3ff" stop-opacity="0.40"/>
    <stop offset="96%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65"/>
  </radialGradient>

  <!-- ПЛАВНОЕ СИНЕЕ СВЕЧЕНИЕ -->
  <radialGradient id="glowSmoothBlue"
    cx="50%" cy="50%" r="52%">
    <stop offset="58%" stop-color="#3b5bff" stop-opacity="0"/>
    <stop offset="72%" stop-color="#3f66ff" stop-opacity="0.15"/>
    <stop offset="82%" stop-color="#4f74ff" stop-opacity="0.30"/>
    <stop offset="90%" stop-color="#6a8cff" stop-opacity="0.50"/>
    <stop offset="96%" stop-color="#8aa4ff" stop-opacity="0.70"/>
    <stop offset="100%" stop-color="#9fb2ff" stop-opacity="0.85"/>
  </radialGradient>

</defs>

<!-- ФОН -->
<rect width="100%" height="100%" fill="url(#bg)"/>

<!-- ВЕРХНИЙ -->
<circle cx="720" cy="180" r="620" fill="url(#glowSmooth)"/>
<circle cx="720" cy="180" r="580" fill="url(#bodyDark)"/>

<!-- ЦЕНТР -->
<circle cx="280" cy="920" r="780" fill="url(#glowSmooth)"/>
<circle cx="280" cy="920" r="740" fill="url(#bodyDark)"/>

<!-- НИЗ (синий) -->
<circle cx="650" cy="1650" r="580" fill="url(#glowSmoothBlue)"/>
<circle cx="650" cy="1650" r="540" fill="url(#bodyBlue)"/>

</svg>