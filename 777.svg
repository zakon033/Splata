<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="background: #000;">
  <defs>
    <linearGradient id="appleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c003e" />
      <stop offset="50%" stop-color="#c1272d" />
      <stop offset="100%" stop-color="#ee9ca7" />
    </linearGradient>

    <filter id="distortFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" />
    </filter>

    <filter id="lensEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="100" result="distorted"/>
      <feComposite in="distorted" in2="SourceAlpha" operator="in" />
    </filter>
  </defs>

  <g>
    <rect width="800" height="600" fill="url(#appleGrad)" />
    <text x="50%" y="50%" font-family="system-ui, sans-serif" font-weight="900" font-size="80" fill="white" text-anchor="middle" opacity="0.5">APPLE EVENT</text>
  </g>

  <g style="mix-blend-mode: plus-lighter;">
    <circle r="120" fill="white" filter="url(#lensEffect)">
      <animateMotion dur="8s" repeatCount="indefinite" path="M200,300 Q400,100 600,300 T200,300" />
    </circle>

    <circle r="100" fill="white" filter="url(#lensEffect)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M600,300 Q400,500 200,300 T600,300" />
    </circle>
  </g>

  <g fill="none" stroke="white" stroke-width="0.5" opacity="0.4">
    <circle r="120">
      <animateMotion dur="8s" repeatCount="indefinite" path="M200,300 Q400,100 600,300 T200,300" />
    </circle>
    <circle r="100">
      <animateMotion dur="6s" repeatCount="indefinite" path="M600,300 Q400,500 200,300 T600,300" />
    </circle>
  </g>
</svg>
