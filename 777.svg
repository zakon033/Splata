<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 2000"
     width="1000"
     height="2000">

<defs>

  <!-- ФОН -->
  <radialGradient id="bgMain" cx="50%" cy="25%" r="95%">
    <stop offset="0%" stop-color="#1f2333"/>
    <stop offset="55%" stop-color="#0c0f1b"/>
    <stop offset="100%" stop-color="#05070d"/>
  </radialGradient>

  <!-- === ОБЪЁМНЫЕ ТЕЛА === -->

  <radialGradient id="bodyDark"
    cx="42%" cy="34%" r="68%"
    fx="38%" fy="30%">
    <stop offset="0%" stop-color="#4a4654" stop-opacity="0.95"/>
    <stop offset="55%" stop-color="#1c1d26"/>
    <stop offset="100%" stop-color="#07080d"/>
  </radialGradient>

  <radialGradient id="bodyBlue"
    cx="48%" cy="46%" r="68%"
    fx="52%" fy="42%">
    <stop offset="0%" stop-color="#2d4cff" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#0e1b5a" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#050710"/>
  </radialGradient>

  <!-- === СВЕЧЕНИЕ (МНОГОСЛОЙНОЕ) === -->

  <!-- широкий мягкий ореол -->
  <radialGradient id="glowWide"
    cx="50%" cy="50%" r="52%">
    <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="85%" stop-color="#cfd3ff" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#b8bcff" stop-opacity="0.28"/>
  </radialGradient>

  <!-- основной край -->
  <radialGradient id="glowEdge"
    cx="50%" cy="50%" r="50%">
    <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="88%" stop-color="#e4e6ff" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
  </radialGradient>

  <!-- синий край -->
  <radialGradient id="glowBlue"
    cx="50%" cy="50%" r="50%">
    <stop offset="65%" stop-color="#3f5bff" stop-opacity="0"/>
    <stop offset="88%" stop-color="#4f74ff" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#6a8cff" stop-opacity="0.75"/>
  </radialGradient>

</defs>

<!-- ФОН -->
<rect width="100%" height="100%" fill="url(#bgMain)"/>

<!-- === ВЕРХНИЙ КРУГ === -->
<circle cx="720" cy="180" r="640" fill="url(#glowWide)"/>
<circle cx="720" cy="180" r="610" fill="url(#glowEdge)"/>
<circle cx="720" cy="180" r="580" fill="url(#bodyDark)"/>

<!-- === ЦЕНТРАЛЬНЫЙ КРУГ === -->
<circle cx="280" cy="920" r="800" fill="url(#glowWide)"/>
<circle cx="280" cy="920" r="770" fill="url(#glowEdge)"/>
<circle cx="280" cy="920" r="740" fill="url(#bodyDark)"/>

<!-- === НИЖНИЙ СИНИЙ КРУГ === -->
<circle cx="650" cy="1650" r="600" fill="url(#glowWide)"/>
<circle cx="650" cy="1650" r="570" fill="url(#glowBlue)"/>
<circle cx="650" cy="1650" r="540" fill="url(#bodyBlue)"/>

</svg>