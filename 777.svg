<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" style="background: #000;">
  <defs>
    <g id="lensesMap">
      <rect width="800" height="800" fill="#808080" /> <circle r="150" fill="white">
        <animateMotion dur="10s" repeatCount="indefinite" path="M300,400 Q400,300 500,400 T300,400" />
      </circle>
      
      <circle r="130" fill="white" opacity="0.6">
        <animateMotion dur="7s" repeatCount="indefinite" path="M500,400 Q400,500 300,400 T500,400" />
      </circle>

      <circle r="140" fill="white" opacity="0.4">
        <animateMotion dur="12s" repeatCount="indefinite" path="M400,300 L400,500 Z" />
      </circle>
    </g>

    <filter id="iphone16Filter" x="-20%" y="-20%" width="140%" height="140%">
      <feSpawnableImage result="map">
         </feSpawnableImage>
      
      <feDisplacementMap in="SourceGraphic" in2="SourceGraphic" scale="50" xChannelSelector="R" yChannelSelector="B" />
    </filter>
    
    <filter id="distort" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="1" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" />
    </filter>
  </defs>

  <g filter="url(#distort)">
    <rect width="100%" height="100%" fill="#1a0033" />
    <circle cx="400" cy="400" r="300" fill="rgba(100,0,255,0.4)" />
    <rect x="0" y="380" width="800" height="40" fill="rgba(255,100,0,0.3)" />
  </g>

  <g style="mix-blend-mode: overlay;">
    <circle r="150" fill="white" filter="url(#distort)">
      <animateMotion dur="10s" repeatCount="indefinite" path="M300,400 Q400,300 500,400 T300,400" />
    </circle>
    <circle r="130" fill="white" filter="url(#distort)">
      <animateMotion dur="7s" repeatCount="indefinite" path="M500,400 Q400,500 300,400 T500,400" />
    </circle>
  </g>
</svg>
